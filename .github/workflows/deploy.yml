name: Deploy PHP para Kinghost (Deploy Incremental Inteligente)

# Se o deploy falhar com ETIMEDOUT na porta 21: o runner do GitHub não alcança o FTP
# (firewall/hospedagem). Ver docs/COMANDOS_SERVIDOR_SSH.md (secção "GitHub Actions: erro FTP ETIMEDOUT").
#
# Kinghost (tiaraju02): no SFTP/FileZilla o caminho completo pode ser .../www/administrativo (árvore com pasta administrativo/).
# Na porta 21 (FTP do GitHub) a conta costuma estar já «chrootada» DENTRO de .../administrativo — aí NÃO existe subpasta
# administrativo/ na listagem; use KINGHOST_FTP_REMOTE_DIR: '.' (padrão). Use «administrativo» só se o pwd FTP listar
# mesmo uma pasta administrativo/ para entrar (raiz = pai do projecto).
# Use «files» apenas se a raiz FTP for mesmo a pasta files/ antes de app/.
#
# Secret FTP_USER_PROD: utilizar o mesmo user FTP do painel/FileZilla (ex.: tiaraju02), não confundir com o login SSH tiaraju.
# FTPS: certificado *.kinghost.net vs host ftp.* → protocol ftps + security loose na action.
#
# O lftp e o SamKirkland usam o mesmo prefixo (env abaixo).
#
# Teste manual (FileZilla): NÃO use MKD/STOR dentro de lib/ — em muitos planos essa árvore é só leitura ou o FTP
# recusa escrita lá (550 Permission denied). Valide escrita na raiz do site (pwd após login) ou em public/.

on:
  push:
    branches:
      - main
      - dev-master
  workflow_dispatch:
    inputs:
      debug_ftp:
        description: "Rodar pwd + listagem curta na raiz FTP (diagnóstico)"
        required: false
        default: false
        type: boolean

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Padrão «.» = sessão FTP já na raiz do repo (chroot .../administrativo). «administrativo» = só se pwd listar essa subpasta.
      KINGHOST_FTP_REMOTE_DIR: '.'

    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verificar Secrets FTP
        run: |
          echo "🔍 === VERIFICAÇÃO DE SECRETS ==="
          if [ -z "${{ secrets.FTP_SERVER_PROD }}" ]; then
            echo "❌ ERRO: FTP_SERVER_PROD não está configurado!"
            exit 1
          fi
          if [ -z "${{ secrets.FTP_USER_PROD }}" ]; then
            echo "❌ ERRO: FTP_USER_PROD não está configurado!"
            exit 1
          fi
          if [ -z "${{ secrets.FTP_PASS_PROD }}" ]; then
            echo "❌ ERRO: FTP_PASS_PROD não está configurado!"
            exit 1
          fi
          echo "✅ Todos os secrets estão configurados"
          echo "📂 Prefixo remoto (KINGHOST_FTP_REMOTE_DIR): ${KINGHOST_FTP_REMOTE_DIR:-?}"
          echo "::notice::Confirme no GitHub que FTP_USER_PROD é o user FTP (ex.: tiaraju02), não o login SSH (tiaraju)."
          echo "::notice::Teste de escrita no FileZilla: raiz do site ou public/ — não crie ficheiros dentro de lib/ (deploy não precisa disso)."

      - name: Diagnóstico FTP (pwd + listagem)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.debug_ftp == 'true'
        continue-on-error: true
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER_PROD }}
          FTP_USER: ${{ secrets.FTP_USER_PROD }}
          FTP_PASS: ${{ secrets.FTP_PASS_PROD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          echo "::group::Raiz FTP (pwd + primeiras linhas de ls)"
          lftp <<EOF
          set cmd:fail-exit no
          set net:prefer-ipv4 true
          set ftp:passive-mode true
          set ssl:verify-certificate no
          set ftp:ssl-force true
          open -u "$FTP_USER","$FTP_PASS" ftp://$FTP_HOST
          pwd
          cls -1 | head -100
          quit
          EOF
          echo "::endgroup::"
          echo "::notice::Se pwd listar app/public na raiz → use «.» (padrão GitHub). Se listar pasta administrativo/ para entrar no site → use «administrativo»."

      - name: Deploy Incremental - Tentativa 1
        id: deploy1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER_PROD }}
          username: ${{ secrets.FTP_USER_PROD }}
          password: ${{ secrets.FTP_PASS_PROD }}
          protocol: ftps
          security: loose
          local-dir: ./
          server-dir: ${{ env.KINGHOST_FTP_REMOTE_DIR == '.' && './' || format('{0}/', env.KINGHOST_FTP_REMOTE_DIR) }}
          dangerous-clean-slate: false
          log-level: standard
          timeout: 300000
          exclude: |
            .git/
            .git/**
            .github/
            .github/**
            .gitignore
            .DS_Store
            LICENSE.txt
            node_modules/
            node_modules/**
            .vscode/
            .vscode/**
            **/*.log
            vendor/
            vendor/**
            **/receive copy/**
            **/receive%20copy/**
            **/* copy.php
            lib/
            lib/**

      - name: Deploy Incremental - Tentativa 2
        if: steps.deploy1.outcome == 'failure'
        id: deploy2
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER_PROD }}
          username: ${{ secrets.FTP_USER_PROD }}
          password: ${{ secrets.FTP_PASS_PROD }}
          protocol: ftps
          security: loose
          local-dir: ./
          server-dir: ${{ env.KINGHOST_FTP_REMOTE_DIR == '.' && './' || format('{0}/', env.KINGHOST_FTP_REMOTE_DIR) }}
          dangerous-clean-slate: false
          log-level: standard
          timeout: 300000
          exclude: |
            .git/
            .git/**
            .github/
            .github/**
            .gitignore
            .DS_Store
            LICENSE.txt
            node_modules/
            node_modules/**
            .vscode/
            .vscode/**
            **/*.log
            vendor/
            vendor/**
            **/receive copy/**
            **/receive%20copy/**
            **/* copy.php
            lib/
            lib/**

      - name: Deploy Incremental - Tentativa 3
        if: steps.deploy2.outcome == 'failure'
        id: deploy3
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER_PROD }}
          username: ${{ secrets.FTP_USER_PROD }}
          password: ${{ secrets.FTP_PASS_PROD }}
          protocol: ftps
          security: loose
          local-dir: ./
          server-dir: ${{ env.KINGHOST_FTP_REMOTE_DIR == '.' && './' || format('{0}/', env.KINGHOST_FTP_REMOTE_DIR) }}
          dangerous-clean-slate: false
          log-level: standard
          timeout: 300000
          exclude: |
            .git/
            .git/**
            .github/
            .github/**
            .gitignore
            .DS_Store
            LICENSE.txt
            node_modules/
            node_modules/**
            .vscode/
            .vscode/**
            **/*.log
            vendor/
            vendor/**
            **/receive copy/**
            **/receive%20copy/**
            **/* copy.php
            lib/
            lib/**

      - name: Deploy Incremental - Tentativa 4
        if: steps.deploy3.outcome == 'failure'
        id: deploy4
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER_PROD }}
          username: ${{ secrets.FTP_USER_PROD }}
          password: ${{ secrets.FTP_PASS_PROD }}
          protocol: ftps
          security: loose
          local-dir: ./
          server-dir: ${{ env.KINGHOST_FTP_REMOTE_DIR == '.' && './' || format('{0}/', env.KINGHOST_FTP_REMOTE_DIR) }}
          dangerous-clean-slate: false
          log-level: standard
          timeout: 300000
          exclude: |
            .git/
            .git/**
            .github/
            .github/**
            .gitignore
            .DS_Store
            LICENSE.txt
            node_modules/
            node_modules/**
            .vscode/
            .vscode/**
            **/*.log
            vendor/
            vendor/**
            **/receive copy/**
            **/receive%20copy/**
            **/* copy.php
            lib/
            lib/**

      - name: Deploy Incremental - Tentativa 5
        if: steps.deploy4.outcome == 'failure'
        id: deploy5
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER_PROD }}
          username: ${{ secrets.FTP_USER_PROD }}
          password: ${{ secrets.FTP_PASS_PROD }}
          protocol: ftps
          security: loose
          local-dir: ./
          server-dir: ${{ env.KINGHOST_FTP_REMOTE_DIR == '.' && './' || format('{0}/', env.KINGHOST_FTP_REMOTE_DIR) }}
          dangerous-clean-slate: false
          log-level: standard
          timeout: 300000
          exclude: |
            .git/
            .git/**
            .github/
            .github/**
            .gitignore
            .DS_Store
            LICENSE.txt
            node_modules/
            node_modules/**
            .vscode/
            .vscode/**
            **/*.log
            vendor/
            vendor/**
            **/receive copy/**
            **/receive%20copy/**
            **/* copy.php
            lib/
            lib/**

      - name: Forçar upload - Controllers logs
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER_PROD }}
          username: ${{ secrets.FTP_USER_PROD }}
          password: ${{ secrets.FTP_PASS_PROD }}
          protocol: ftps
          security: loose
          local-dir: app/adms/Controllers/logs/
          server-dir: ${{ env.KINGHOST_FTP_REMOTE_DIR == '.' && './app/adms/Controllers/logs/' || format('{0}/app/adms/Controllers/logs/', env.KINGHOST_FTP_REMOTE_DIR) }}
          dangerous-clean-slate: false
          log-level: standard
          exclude: |
            **/*.log

      - name: Forçar upload - Views logs
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER_PROD }}
          username: ${{ secrets.FTP_USER_PROD }}
          password: ${{ secrets.FTP_PASS_PROD }}
          protocol: ftps
          security: loose
          local-dir: app/adms/Views/logs/
          server-dir: ${{ env.KINGHOST_FTP_REMOTE_DIR == '.' && './app/adms/Views/logs/' || format('{0}/app/adms/Views/logs/', env.KINGHOST_FTP_REMOTE_DIR) }}
          dangerous-clean-slate: false
          log-level: standard
          exclude: |
            **/*.log

      - name: Forçar upload via lftp (logs)
        if: always()
        continue-on-error: true
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER_PROD }}
          FTP_USER: ${{ secrets.FTP_USER_PROD }}
          FTP_PASS: ${{ secrets.FTP_PASS_PROD }}
        run: |
          if ! command -v lftp &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y lftp
          fi
          REMOTE="${KINGHOST_FTP_REMOTE_DIR:-.}"
          if [ "$REMOTE" = "." ]; then
            RCTL="app/adms/Controllers/logs"
            RVIE="app/adms/Views/logs"
          else
            RCTL="$REMOTE/app/adms/Controllers/logs"
            RVIE="$REMOTE/app/adms/Views/logs"
          fi
          set +e
          lftp <<EOF
          set cmd:fail-exit no
          set net:prefer-ipv4 true
          set ftp:passive-mode true
          set ssl:verify-certificate no
          set ftp:ssl-force true
          set net:timeout 120
          set net:max-retries 20
          set net:reconnect-interval-base 2
          set net:reconnect-interval-max 10
          open -u "$FTP_USER","$FTP_PASS" ftp://$FTP_HOST
          mirror -R --only-newer --continue --no-perms \
            --exclude-glob *.log \
            ./app/adms/Controllers/logs $RCTL
          mirror -R --only-newer --continue --no-perms \
            --exclude-glob *.log \
            ./app/adms/Views/logs $RVIE
          quit
          EOF
          echo "::notice::Passo opcional (logs). 550 aqui costuma ser permissão no remoto ou prefixo KINGHOST_FTP_REMOTE_DIR errado; o deploy principal segue nos passos anteriores."
          exit 0

      # Só após a 5.ª tentativa falhar (deploy5 não corre se alguma anterior tiver sucesso; evita lftp se checkout/secrets falharem).
      - name: Install lftp (Fallback Inteligente)
        if: steps.deploy5.outcome == 'failure'
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy via lftp (Fallback Incremental)
        id: lftp_fallback
        if: steps.deploy5.outcome == 'failure'
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER_PROD }}
          FTP_USER: ${{ secrets.FTP_USER_PROD }}
          FTP_PASS: ${{ secrets.FTP_PASS_PROD }}
        run: |
          echo "🚨 FTP falhou 5 vezes, usando lftp incremental..."
          echo "⏳ Mirror completo do repo: pode levar 10–40+ min (centenas de MB / milhares de ficheiros). Sem --verbose no mirror para o runner não ficar preso a imprimir linhas."
          REMOTE="${KINGHOST_FTP_REMOTE_DIR:-.}"
          if [ "$REMOTE" = "." ]; then
            LFTP_TARGET="."
          else
            LFTP_TARGET="$REMOTE"
          fi
          echo "📂 Destino remoto do mirror: $LFTP_TARGET (KINGHOST_FTP_REMOTE_DIR=$REMOTE)"
          lftp <<EOF
          set cmd:fail-exit no
          set net:prefer-ipv4 true
          set ftp:passive-mode true
          set ssl:verify-certificate no
          set ftp:ssl-force true
          set net:timeout 300
          set net:max-retries 200
          set net:reconnect-interval-base 5
          set net:reconnect-interval-max 60
          set net:idle 120
          set xfer:clobber on
          open -u "$FTP_USER","$FTP_PASS" ftp://$FTP_HOST
          mirror -R --parallel=3 --only-newer --continue --no-perms \
            --exclude-glob .git/** \
            --exclude-glob .github/** \
            --exclude-glob .gitignore \
            --exclude-glob .env \
            --exclude-glob '*.log' \
            --exclude-glob vendor/** \
            --exclude-glob lib/** \
            --exclude-glob node_modules/** \
            --exclude-glob .vscode/** \
            --exclude-glob .DS_Store \
            --exclude-glob LICENSE.txt \
            --exclude-glob '*receive copy*' \
            --exclude-glob '*receive%20copy*' \
            --exclude-glob '* copy.php' \
            ./ $LFTP_TARGET
          quit
          EOF

      # Captura e exibe logs detalhados do deploy
      - name: Capturar Logs Detalhados do Deploy
        if: always()
        run: |
          echo "🔍 === CAPTURA DE LOGS DETALHADOS ==="
          echo "📊 Status de cada tentativa:"
          echo "   Tentativa 1: ${{ steps.deploy1.outcome }}"
          echo "   Tentativa 2: ${{ steps.deploy2.outcome }}"
          echo "   Tentativa 3: ${{ steps.deploy3.outcome }}"
          echo "   Tentativa 4: ${{ steps.deploy4.outcome }}"
          echo "   Tentativa 5: ${{ steps.deploy5.outcome }}"
          echo "   Fallback lftp: ${{ steps.lftp_fallback.outcome }}"
          echo ""
          echo "📋 Logs detalhados estão disponíveis em:"
          echo "   GitHub Actions → Jobs → deploy → Steps"
          echo ""
          echo "🔍 Para ver logs de arquivos específicos:"
          echo "   1. Expanda o step 'Deploy Incremental - Tentativa X'"
          echo "   2. Procure por mensagens como:"
          echo "      ✅ 'Uploading: README.md' (arquivo novo)"
          echo "      🔄 'Updating: README.md' (arquivo modificado)"
          echo "      ⏭️ 'Skipping: README.md' (arquivo idêntico)"
          echo ""
          echo "💡 Dica: Use Ctrl+F nos logs para buscar por 'README.md'"

      # Criação automática de pastas essenciais no servidor
      - name: Criar Pastas Essenciais no Servidor
        if: always()
        continue-on-error: true
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER_PROD }}
          FTP_USER: ${{ secrets.FTP_USER_PROD }}
          FTP_PASS: ${{ secrets.FTP_PASS_PROD }}
        run: |
          echo "🔧 === CRIAÇÃO DE PASTAS ESSENCIAIS ==="
          echo "📁 Criando pastas necessárias no servidor..."

          # Instalar lftp se não estiver disponível
          if ! command -v lftp &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y lftp
          fi

          REMOTE="${KINGHOST_FTP_REMOTE_DIR:-.}"
          echo "🔄 lftp: criando logs/ e public/uploads/ sob prefixo remoto «$REMOTE» (FTPS explícito; melhor esforço)"
          set +e
          {
            echo set cmd:fail-exit no
            echo set net:prefer-ipv4 true
            echo set ftp:passive-mode true
            echo set ssl:verify-certificate no
            echo set ftp:ssl-force true
            echo set net:timeout 30
            echo "open -u \"$FTP_USER\",\"$FTP_PASS\" ftp://$FTP_HOST"
            [ "$REMOTE" != "." ] && echo "cd $REMOTE"
            echo mkdir -p logs
            echo mkdir -p public/uploads
            echo chmod 755 logs
            echo chmod 755 public/uploads
            echo quit
          } | lftp
          ec=$?
          set -e
          if [ "$ec" != 0 ]; then
            echo "::notice::mkdir/chmod remoto falhou (código $ec). Ajuste permissões na raiz do site; o deploy não exige escrita em lib/."
          fi
          exit 0

      # Verificação final e relatório de integridade detalhado
      - name: Verificar Deploy e Gerar Relatório Detalhado
        if: always()
        run: |
          echo "🔍 === RELATÓRIO DE DEPLOY DETALHADO ==="

          if [ "${{ steps.deploy1.outcome }}" == "success" ] || [ "${{ steps.deploy2.outcome }}" == "success" ] || [ "${{ steps.deploy3.outcome }}" == "success" ] || [ "${{ steps.deploy4.outcome }}" == "success" ] || [ "${{ steps.deploy5.outcome }}" == "success" ]; then
            echo "✅ Deploy FTP bem-sucedido!"
            echo "📊 Tentativas utilizadas:"
            [ "${{ steps.deploy1.outcome }}" == "success" ] && echo "   - Tentativa 1: ✅"
            [ "${{ steps.deploy2.outcome }}" == "success" ] && echo "   - Tentativa 2: ✅"
            [ "${{ steps.deploy3.outcome }}" == "success" ] && echo "   - Tentativa 3: ✅"
            [ "${{ steps.deploy4.outcome }}" == "success" ] && echo "   - Tentativa 4: ✅"
            [ "${{ steps.deploy5.outcome }}" == "success" ] && echo "   - Tentativa 5: ✅"
          elif [ "${{ steps.lftp_fallback.outcome }}" == "success" ]; then
            echo "⚠️ As 5 tentativas FTP falharam, mas o fallback lftp incremental concluiu com sucesso."
            echo "📊 Tentativas FTP: ❌❌❌❌❌"
            echo "🔄 Fallback lftp: ✅"
          elif [ "${{ steps.lftp_fallback.outcome }}" == "failure" ]; then
            echo "❌ As 5 tentativas FTP falharam e o fallback lftp também falhou (rede, credenciais ou bloqueio do servidor)."
            echo "📊 Tentativas FTP: ❌❌❌❌❌"
            echo "🔄 Fallback lftp: ❌"
          else
            echo "⚠️ Nenhuma tentativa FTP teve sucesso."
            echo "📊 Tentativas FTP: ❌❌❌❌❌"
            echo "🔄 Fallback lftp: ${{ steps.lftp_fallback.outcome }} (skipped = deploy FTP ok antes da 5.ª falha, ou job não chegou ao fallback)"
          fi

          echo ""
          echo "🧪 Diagnóstico (erros FTP / lftp):"
          echo "   - «550 ~/administrativo»: a sessão FTP já está DENTRO do projecto → use KINGHOST_FTP_REMOTE_DIR «.» (padrão)."
          echo "   - Só use «administrativo» se o pwd na raiz FTP listar essa pasta (pai do site)."
          echo "   - «550 … Operation not permitted»: permissão/dono no servidor ou user FTP ≠ dono dos ficheiros (SSH: ls -la)."
          echo "   - «550 … em lib/»: normal se lib for só leitura; o pipeline não envia lib/ (exclude) nem precisa de MKD lá."
          echo "   - workflow_dispatch «debug_ftp»: pwd + listagem na raiz FTP."
          echo "   - Duplicados no Git a remover quando possível: receive copy, receive%20copy, ficheiros «* copy.php»."
          echo ""
          echo "📋 Próximos passos no servidor:"
          echo "1. Acesse via SSH ou painel KingHost"
          echo "2. Execute: cd ~/www/administrativo (ou caminho correcto da raiz do projecto no servidor)"
          echo "3. Execute: composer install --no-dev --optimize-autoloader"
          echo "4. Configure .env com URL_ADM correta"
          echo "5. Execute: php scripts/generate-htaccess.php"
          echo "6. Verifique permissões: chmod 755 public/uploads/"
          echo ""
          echo "🔍 Verificação de integridade:"
          echo "   - app/adms/Controllers/ (deve ter todos os arquivos .php)"
          echo "   - app/adms/Models/ (deve ter todos os arquivos .php)"
          echo "   - app/adms/Views/ (deve ter todas as pastas e arquivos)"
          echo "   - app/Helpers/ (deve ter todos os arquivos .php)"
          echo "   - routes/ (deve ter todos os arquivos .php)"
          echo "   - public/ (deve ter todas as pastas e arquivos)"
          echo "   - scripts/ (deve ter todos os arquivos .php)"
          echo ""
          echo "💡 Dica: O deploy foi INCREMENTAL - apenas arquivos novos/modificados foram enviados"
          echo "💡 Dica: Use 'dangerous-clean-slate: false' para continuar onde parou"
          echo ""
          echo "📊 === DETALHAMENTO DO DEPLOY INCREMENTAL ==="
          echo "🔄 Como funciona o deploy incremental:"
          echo "   ✅ Arquivo NÃO existe no servidor → ENVIA (primeira vez)"
          echo "   🔄 Arquivo existe mas foi MODIFICADO → ATUALIZA (sobrescreve)"
          echo "   ⏭️ Arquivo existe e é IDÊNTICO → PULA (não envia)"
          echo ""
          echo "🔍 Detecção automática:"
          echo "   📏 Tamanho do arquivo"
          echo "   📅 Data de modificação (timestamp)"
          echo "   🔐 Hash/checksum (quando disponível)"
          echo ""
          echo "⚡ Benefícios:"
          echo "   🚀 Muito mais rápido (só envia diferenças)"
          echo "   💾 Economiza banda (não repete arquivos)"
          echo "   🛡️ Preserva progresso (continua onde parou)"
          echo "   🔄 Sempre atualiza o que mudou"
          echo ""
          echo "🔍 === COMO VER OS LOGS DETALHADOS ==="
          echo "📋 Para ver logs detalhados em tempo real:"
          echo "1. Clique no job 'deploy' no GitHub Actions"
          echo "2. Clique no step 'Deploy Incremental - Tentativa X'"
          echo "3. Expanda os logs para ver cada arquivo sendo processado"
          echo "4. Procure por mensagens como:"
          echo "   - 'Uploading: arquivo.php' (arquivo novo)"
          echo "   - 'Updating: arquivo.php' (arquivo modificado)"
          echo "   - 'Skipping: arquivo.php' (arquivo idêntico)"
          echo ""
          echo "💡 Dica: log-level «standard» nas tentativas FTP reduz ruído; detalhe máximo nos steps em caso de erro"
          echo "💡 Dica: Use Ctrl+F para buscar por arquivos específicos nos logs"
