name: Deploy PHP para Kinghost (lftp incremental)

# FTP-Deploy-Action (Node) costuma falhar com ETIMEDOUT/FIN packet a partir dos runners GitHub.
# Este workflow usa apenas lftp, que se conecta de forma mais estável à Kinghost.
# Após deploys falhos: rode manualmente com "Forçar reenvio" ou envie via FileZilla.

on:
  push:
    branches:
      - main
      - dev-master
  workflow_dispatch:
    inputs:
      force_upload:
        description: 'Forçar reenvio de arquivos (ignora --only-newer; use após deploys falhos)'
        required: false
        default: false
        type: boolean

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout código
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Verificar Secrets FTP
        run: |
          if [ -z "${{ secrets.FTP_SERVER_PROD }}" ] || [ -z "${{ secrets.FTP_USER_PROD }}" ] || [ -z "${{ secrets.FTP_PASS_PROD }}" ]; then
            echo "❌ Configure FTP_SERVER_PROD, FTP_USER_PROD e FTP_PASS_PROD nos secrets."
            exit 1
          fi
          echo "✅ Secrets FTP configurados."

      - name: Instalar lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy via lftp
        id: lftp_deploy
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER_PROD }}
          FTP_USER: ${{ secrets.FTP_USER_PROD }}
          FTP_PASS: ${{ secrets.FTP_PASS_PROD }}
          FORCE_UPLOAD: ${{ github.event_name == 'workflow_dispatch' && inputs.force_upload && '1' || '0' }}
        run: |
          set -euo pipefail
          MIRROR_OPTS="-R --parallel=2 --continue --no-perms --verbose"
          if [ "$FORCE_UPLOAD" = "1" ]; then
            echo "⚠️ Modo forçado: reenviando arquivos locais (sem --only-newer)."
          else
            MIRROR_OPTS="$MIRROR_OPTS --only-newer"
            echo "📋 Modo incremental: --only-newer + --continue"
          fi

          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<EOF
          set cmd:fail-exit yes
          set ftp:passive-mode true
          set ftp:ssl-allow no
          set ftp:prefer-ipv4 yes
          set dns:order inet
          set net:timeout 120
          set net:max-retries 50
          set net:reconnect-interval-base 2
          set net:reconnect-interval-max 10
          set net:idle 60
          set xfer:clobber on

          mirror $MIRROR_OPTS \
            --exclude-glob .git/** \
            --exclude-glob .github/** \
            --exclude-glob .gitignore \
            --exclude-glob .env \
            --exclude-glob .env.* \
            --exclude-glob '*.log' \
            --exclude-glob '**/*.log' \
            --exclude-glob vendor/** \
            --exclude-glob lib/** \
            --exclude-glob node_modules/** \
            --exclude-glob .vscode/** \
            --exclude-glob .DS_Store \
            --exclude-glob LICENSE.txt \
            --exclude-glob .ftp-deploy-sync-state.json \
            --exclude-glob storage/sst/epi_fichas/** \
            --exclude-glob storage/sst/attachments/** \
            --exclude-glob storage/lgpd/consentimentos/** \
            --exclude-glob storage/private/payroll/** \
            --exclude-glob storage/cache/** \
            --exclude-glob storage/logs/** \
            --exclude-glob logs/** \
            --exclude-glob app/storage/cache/** \
            --exclude-glob app/storage/logs/** \
            --exclude-glob 'app/adms/Controllers/receive copy/**' \
            ./ .

          quit
          EOF

          echo "✅ Deploy lftp concluído."

      - name: Resultado final
        if: always()
        run: |
          if [ "${{ steps.lftp_deploy.outcome }}" = "success" ]; then
            echo "🎯 SUCESSO — código publicado via lftp."
            exit 0
          fi
          echo "❌ FALHA — use FileZilla do seu PC ou workflow manual com 'Forçar reenvio'."
          exit 1
