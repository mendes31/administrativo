name: Deploy PHP para Kinghost (somente upload — nunca apaga)

# Política: o deploy APENAS envia/atualiza ficheiros do Git no servidor.
# NUNCA remove pastas ou ficheiros que existam só em produção (uploads, .env, cache, etc.).
#
# O SamKirkland/FTP-Deploy-Action foi removido porque sincroniza com DELETE
# (apagava public/adms/uploads/users/* no force_full_resync).
#
# Raiz FTP Kinghost: login abre em ~/www/administrativo/ → server-dir ./

on:
  push:
    branches:
      - main
      - dev-master
  workflow_dispatch:

concurrency:
  group: deploy-kinghost-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      FTP_REMOTE_BASE: ''

    steps:
      - name: Checkout código
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Verificar Secrets FTP
        run: |
          if [ -z "${{ secrets.FTP_SERVER_PROD }}" ] || [ -z "${{ secrets.FTP_USER_PROD }}" ] || [ -z "${{ secrets.FTP_PASS_PROD }}" ]; then
            echo "❌ Secrets FTP incompletos"
            exit 1
          fi
          echo "✅ Secrets FTP configurados"

      - name: Instalar lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy via lftp (upload only — sem --delete)
        id: lftp_deploy
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER_PROD }}
          FTP_USER: ${{ secrets.FTP_USER_PROD }}
          FTP_PASS: ${{ secrets.FTP_PASS_PROD }}
        run: |
          echo "📤 Deploy incremental: só envia/atualiza ficheiros do Git."
          echo "   Não usa --delete — nada é removido no servidor."
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<'EOF'
          set cmd:fail-exit yes
          set ftp:passive-mode true
          set ftp:ssl-allow no
          set dns:order "inet inet6"
          set net:timeout 120
          set net:max-retries 50
          set net:reconnect-interval-base 2
          set net:reconnect-interval-max 10
          set net:idle 60
          set xfer:clobber on

          mirror -R --parallel=2 --ignore-time --continue --no-perms --verbose \
            --exclude-glob .git/** \
            --exclude-glob .github/** \
            --exclude-glob .gitignore \
            --exclude-glob .env \
            --exclude-glob .ftp-deploy-sync-state.json \
            --exclude-glob '*.log' \
            --exclude-glob '**/*.log' \
            --exclude-glob vendor/** \
            --exclude-glob lib/** \
            --exclude-glob node_modules/** \
            --exclude-glob .vscode/** \
            --exclude-glob .DS_Store \
            --exclude-glob LICENSE.txt \
            --exclude-glob storage/sst/epi_fichas/** \
            --exclude-glob storage/sst/attachments/** \
            --exclude-glob storage/lgpd/consentimentos/** \
            --exclude-glob storage/private/payroll/** \
            --exclude-glob storage/cache/** \
            --exclude-glob storage/logs/** \
            --exclude-glob logs/** \
            --exclude-glob app/storage/cache/** \
            --exclude-glob app/storage/logs/** \
            --exclude-glob public/adms/uploads/** \
            --exclude-glob 'app/adms/Controllers/receive copy/**' \
            ./ ./
          quit
          EOF
          echo "✅ Upload concluído (sem remoções no servidor)."

      - name: Verificar ficheiros críticos no servidor (SHA-256)
        id: verify_hashes
        if: steps.lftp_deploy.outcome == 'success'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER_PROD }}
          FTP_USER: ${{ secrets.FTP_USER_PROD }}
          FTP_PASS: ${{ secrets.FTP_PASS_PROD }}
          FTP_REMOTE_BASE: ''
        run: php scripts/verify_ftp_deploy_hashes.php

      - name: Resultado final do deploy
        if: always()
        run: |
          echo "📊 lftp upload: ${{ steps.lftp_deploy.conclusion }}"
          echo "📊 Verificação SHA-256: ${{ steps.verify_hashes.conclusion }}"
          if [ "${{ steps.lftp_deploy.conclusion }}" != "success" ]; then
            echo "❌ Falha no upload FTP."
            exit 1
          fi
          if [ "${{ steps.verify_hashes.conclusion }}" != "success" ]; then
            echo "❌ Upload OK mas ficheiros críticos divergem do Git."
            exit 1
          fi
          echo "✅ Deploy concluído — código atualizado, nada apagado no servidor."
