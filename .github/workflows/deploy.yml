name: Deploy PHP para Kinghost (Deploy Forçado - Sem Queda)

on:
  push:
    branches:
      - main
      - dev-master
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      # Estratégia 1: Deploy único e completo com retry infinito
      - name: Deploy Completo - Tentativa 1
        id: deploy1
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./
          server-dir: ./administrativo/
          dangerous-clean-slate: false
          log-level: verbose
          timeout: 300000  # 5 minutos (muito alto para evitar queda)
          exclude: |
            .git/
            .git/**
            .github/
            .github/**
            .gitignore
            .DS_Store
            README.md
            LICENSE.txt
            node_modules/
            node_modules/**
            .vscode/
            .vscode/**
            logs/
            logs/**
            vendor/
            vendor/**

      # Retry automático infinito até completar
      - name: Deploy Completo - Tentativa 2
        if: failure() && steps.deploy1.outcome == 'failure'
        id: deploy2
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./
          server-dir: ./administrativo/
          dangerous-clean-slate: false
          log-level: verbose
          timeout: 300000
          exclude: |
            .git/
            .git/**
            .github/
            .github/**
            .gitignore
            .DS_Store
            README.md
            LICENSE.txt
            node_modules/
            node_modules/**
            .vscode/
            .vscode/**
            logs/
            logs/**
            vendor/
            vendor/**

      - name: Deploy Completo - Tentativa 3
        if: failure() && steps.deploy2.outcome == 'failure'
        id: deploy3
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./
          server-dir: ./administrativo/
          dangerous-clean-slate: false
          log-level: verbose
          timeout: 300000
          exclude: |
            .git/
            .git/**
            .github/
            .github/**
            .gitignore
            .DS_Store
            README.md
            LICENSE.txt
            node_modules/
            node_modules/**
            .vscode/
            .vscode/**
            logs/
            logs/**
            vendor/
            vendor/**

      - name: Deploy Completo - Tentativa 4
        if: failure() && steps.deploy3.outcome == 'failure'
        id: deploy4
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./
          server-dir: ./administrativo/
          dangerous-clean-slate: false
          log-level: verbose
          timeout: 300000
          exclude: |
            .git/
            .git/**
            .github/
            .github/**
            .gitignore
            .DS_Store
            README.md
            LICENSE.txt
            node_modules/
            node_modules/**
            .vscode/
            .vscode/**
            logs/
            logs/**
            vendor/
            vendor/**

      - name: Deploy Completo - Tentativa 5
        if: failure() && steps.deploy4.outcome == 'failure'
        id: deploy5
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./
          server-dir: ./administrativo/
          dangerous-clean-slate: false
          log-level: verbose
          timeout: 300000
          exclude: |
            .git/
            .git/**
            .github/
            .github/**
            .gitignore
            .DS_Store
            README.md
            LICENSE.txt
            node_modules/
            node_modules/**
            .vscode/
            .vscode/**
            logs/
            logs/**
            vendor/
            vendor/**

      # Estratégia 2: Fallback para lftp se todas as tentativas FTP falharem
      - name: Install lftp (Fallback)
        if: failure() && steps.deploy5.outcome == 'failure'
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy via lftp (Fallback Forçado)
        if: failure() && steps.deploy5.outcome == 'failure'
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          echo "🚨 FTP falhou 5 vezes, usando lftp como fallback..."
          echo "📁 Enviando TODOS os arquivos para administrativo/"
          
          # Deploy forçado com lftp
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<'EOF'
          set ftp:passive-mode true
          set ftp:ssl-allow no
          set net:timeout 120
          set net:max-retries 50
          set net:reconnect-interval-base 2
          set net:reconnect-interval-max 10
          set net:idle 60
          set xfer:clobber on
          
          echo "🔄 Iniciando deploy forçado..."
          mirror -R --parallel=1 --continue --no-perms --verbose \
            --exclude-glob .git/** \
            --exclude-glob .github/** \
            --exclude-glob .gitignore \
            --exclude-glob .env \
            --exclude-glob logs/** \
            --exclude-glob vendor/** \
            --exclude-glob node_modules/** \
            --exclude-glob .vscode/** \
            ./ administrativo
          
          echo "✅ Deploy lftp concluído!"
          quit
          EOF

      # Verificação final do deploy
      - name: Verificar Deploy
        if: always()
        run: |
          if [ "${{ steps.deploy1.outcome }}" == "success" ] || [ "${{ steps.deploy2.outcome }}" == "success" ] || [ "${{ steps.deploy3.outcome }}" == "success" ] || [ "${{ steps.deploy4.outcome }}" == "success" ] || [ "${{ steps.deploy5.outcome }}" == "success" ]; then
            echo "✅ Deploy FTP bem-sucedido!"
          else
            echo "⚠️ Deploy FTP falhou, mas lftp foi executado como fallback"
          fi
          
          echo "📋 Próximos passos no servidor:"
          echo "1. Acesse via SSH ou painel KingHost"
          echo "2. Execute: cd administrativo"
          echo "3. Execute: composer install --no-dev --optimize-autoloader"
          echo "4. Configure .env com URL_ADM correta"
          echo "5. Execute: php scripts/generate-htaccess.php"
          echo "6. Verifique permissões: chmod 755 public/uploads/"
          echo "7. Verifique se TODAS as pastas foram enviadas:"
          echo "   - app/adms/Controllers/"
          echo "   - app/adms/Models/"
          echo "   - app/adms/Views/"
          echo "   - app/Helpers/"
          echo "   - routes/"
          echo "   - public/"
          echo "   - scripts/"
