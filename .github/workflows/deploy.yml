name: Deploy PHP para Kinghost (Estratégia Dividida)

on:
  push:
    branches:
      - main
      - dev-master
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      # Estratégia 1: Deploy Core Files com retry automático
      - name: Deploy Core Files (PHP, Config) - Tentativa 1
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./
          server-dir: ./administrativo/
          dangerous-clean-slate: false
          log-level: verbose
          timeout: 30000  # 30 segundos (mais conservador)
          exclude: |
            .git/
            .git/**
            .github/
            .github/**
            .gitignore
            .DS_Store
            README.md
            LICENSE.txt
            node_modules/
            node_modules/**
            .vscode/
            .vscode/**
            logs/
            logs/**
            vendor/
            vendor/**
            bootstrap-5.3.3-dist/
            bootstrap-5.3.3-dist/**
            DataTables/
            DataTables/**
            startbootstrap-sb-admin-gh-pages/
            startbootstrap-sb-admin-gh-pages/**
            app/adms/Views/**
            public/adms/image/**
            public/adms/uploads/**
            public/adms/css/**
            public/adms/js/**
            public/adms/jquery/**
            public/adms/DataTables/**

      # Retry automático para Core Files
      - name: Deploy Core Files (PHP, Config) - Tentativa 2
        if: failure()
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./
          server-dir: ./administrativo/
          dangerous-clean-slate: false
          log-level: verbose
          timeout: 30000
          exclude: |
            .git/
            .git/**
            .github/
            .github/**
            .gitignore
            .DS_Store
            README.md
            LICENSE.txt
            node_modules/
            node_modules/**
            .vscode/
            .vscode/**
            logs/
            logs/**
            vendor/
            vendor/**
            bootstrap-5.3.3-dist/
            bootstrap-5.3.3-dist/**
            DataTables/
            DataTables/**
            startbootstrap-sb-admin-gh-pages/
            startbootstrap-sb-admin-gh-pages/**
            app/adms/Views/**
            public/adms/image/**
            public/adms/uploads/**
            public/adms/css/**
            public/adms/js/**
            public/adms/jquery/**
            public/adms/DataTables/**

      # Retry final para Core Files
      - name: Deploy Core Files (PHP, Config) - Tentativa 3
        if: failure()
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./
          server-dir: ./administrativo/
          dangerous-clean-slate: false
          log-level: verbose
          timeout: 30000
          exclude: |
            .git/
            .git/**
            .github/
            .github/**
            .gitignore
            .DS_Store
            README.md
            LICENSE.txt
            node_modules/
            node_modules/**
            .vscode/
            .vscode/**
            logs/
            logs/**
            vendor/
            vendor/**
            bootstrap-5.3.3-dist/
            bootstrap-5.3.3-dist/**
            DataTables/
            DataTables/**
            startbootstrap-sb-admin-gh-pages/
            startbootstrap-sb-admin-gh-pages/**
            app/adms/Views/**
            public/adms/image/**
            public/adms/uploads/**
            public/adms/css/**
            public/adms/js/**
            public/adms/jquery/**
            public/adms/DataTables/**

      # Estratégia 2: Deploy de Views com retry automático
      - name: Deploy Views (Templates) - Tentativa 1
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./app/adms/Views/
          server-dir: ./administrativo/app/adms/Views/
          dangerous-clean-slate: false
          log-level: verbose
          timeout: 30000
          exclude: |
            **/.DS_Store
            **/*.log

      - name: Deploy Views (Templates) - Tentativa 2
        if: failure()
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./app/adms/Views/
          server-dir: ./administrativo/app/adms/Views/
          dangerous-clean-slate: false
          log-level: verbose
          timeout: 30000
          exclude: |
            **/.DS_Store
            **/*.log

      # Estratégia 3: Deploy de Assets públicos (arquivos pequenos)
      - name: Deploy Public Assets
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./public/
          server-dir: ./administrativo/public/
          dangerous-clean-slate: false
          log-level: verbose
          timeout: 60000
          exclude: |
            **/.DS_Store
            **/*.log
            public/adms/image/**
            public/adms/uploads/**
            public/adms/css/**
            public/adms/js/**
            public/adms/jquery/**
            public/adms/DataTables/**

      # Estratégia 4: Deploy de Controllers e Models (arquivos pequenos)
      - name: Deploy Controllers e Models
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./app/adms/Controllers/
          server-dir: ./administrativo/app/adms/Controllers/
          dangerous-clean-slate: false
          log-level: verbose
          timeout: 60000
          exclude: |
            **/.DS_Store
            **/*.log

      - name: Deploy Models
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./app/adms/Models/
          server-dir: ./administrativo/app/adms/Models/
          dangerous-clean-slate: false
          log-level: verbose
          timeout: 60000
          exclude: |
            **/.DS_Store
            **/*.log

      # Estratégia 5: Deploy de Helpers e Routes (arquivos pequenos)
      - name: Deploy Helpers e Routes
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./app/Helpers/
          server-dir: ./administrativo/app/Helpers/
          dangerous-clean-slate: false
          log-level: verbose
          timeout: 60000
          exclude: |
            **/.DS_Store
            **/*.log

      - name: Deploy Routes
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./routes/
          server-dir: ./administrativo/routes/
          dangerous-clean-slate: false
          log-level: verbose
          timeout: 60000
          exclude: |
            **/.DS_Store
            **/*.log

      # Estratégia 6: Deploy de arquivos raiz (arquivos pequenos)
      - name: Deploy Root Files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./
          server-dir: ./administrativo/
          dangerous-clean-slate: false
          log-level: verbose
          timeout: 60000
          exclude: |
            .git/
            .git/**
            .github/
            .github/**
            .gitignore
            .DS_Store
            README.md
            LICENSE.txt
            node_modules/
            node_modules/**
            .vscode/
            .vscode/**
            logs/
            logs/**
            vendor/
            vendor/**
            bootstrap-5.3.3-dist/
            bootstrap-5.3.3-dist/**
            DataTables/
            DataTables/**
            startbootstrap-sb-admin-gh-pages/
            startbootstrap-sb-admin-gh-pages/**
            app/
            public/
            routes/
            scripts/
            database/

      # Estratégia de fallback: Deploy de arquivos críticos individuais
      - name: Deploy Arquivos Críticos (Fallback)
        if: failure()
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./
          server-dir: ./administrativo/
          dangerous-clean-slate: false
          log-level: verbose
          timeout: 15000  # 15 segundos (muito conservador)
          exclude: |
            .git/
            .git/**
            .github/
            .github/**
            .gitignore
            .DS_Store
            README.md
            LICENSE.txt
            node_modules/
            node_modules/**
            .vscode/
            .vscode/**
            logs/
            logs/**
            vendor/
            vendor/**
            bootstrap-5.3.3-dist/
            bootstrap-5.3.3-dist/**
            DataTables/
            DataTables/**
            startbootstrap-sb-admin-gh-pages/
            startbootstrap-sb-admin-gh-pages/**
            app/adms/Views/**
            app/adms/Controllers/**
            app/adms/Models/**
            app/Helpers/**
            public/**
            routes/**
            scripts/**
            database/**

      # Instruções pós-deploy
      - name: Instruções pós-deploy
        run: |
          echo "✅ Deploy concluído!"
          echo "📋 Próximos passos no servidor:"
          echo "1. Acesse via SSH ou painel KingHost"
          echo "2. Execute: cd administrativo"
          echo "3. Execute: composer install --no-dev --optimize-autoloader"
          echo "4. Configure .env com URL_ADM correta"
          echo "5. Execute: php scripts/generate-htaccess.php"
          echo "6. Verifique permissões: chmod 755 public/uploads/"
