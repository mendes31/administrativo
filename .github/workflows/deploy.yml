name: Deploy PHP para Kinghost (upload seguro)

# Política:
# - Só envia/atualiza ficheiros do Git (lftp mirror -R SEM --delete).
# - Nunca apaga uploads, .env, cache, logs nem dados só de produção.
# - Até 3 tentativas lftp se a Kinghost falhar por timeout.
# - Verificação SHA-256 de ficheiros críticos após upload.
#
# Raiz FTP: login abre em ~/www/administrativo/ (server-dir ./)

on:
  push:
    branches:
      - main
      - dev-master
  workflow_dispatch:

concurrency:
  group: deploy-kinghost-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      FTP_REMOTE_BASE: ''
      FTP_HOST: ${{ secrets.FTP_SERVER_PROD }}
      FTP_USER: ${{ secrets.FTP_USER_PROD }}
      FTP_PASS: ${{ secrets.FTP_PASS_PROD }}

    steps:
      - name: Checkout código
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Verificar Secrets FTP
        run: |
          if [ -z "$FTP_HOST" ] || [ -z "$FTP_USER" ] || [ -z "$FTP_PASS" ]; then
            echo "❌ Secrets FTP incompletos (FTP_SERVER_PROD, FTP_USER_PROD, FTP_PASS_PROD)"
            exit 1
          fi
          echo "✅ Secrets FTP configurados"

      - name: Instalar lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Permissão do script de deploy
        run: chmod +x scripts/deploy_lftp_upload.sh

      - name: Deploy lftp — tentativa 1
        id: deploy1
        continue-on-error: true
        run: ./scripts/deploy_lftp_upload.sh 1

      - name: Aguardar antes do retry (45s)
        if: steps.deploy1.outcome != 'success'
        run: sleep 45

      - name: Deploy lftp — tentativa 2
        id: deploy2
        if: steps.deploy1.outcome != 'success'
        continue-on-error: true
        run: ./scripts/deploy_lftp_upload.sh 2

      - name: Aguardar antes do retry (45s)
        if: steps.deploy1.outcome != 'success' && steps.deploy2.outcome != 'success'
        run: sleep 45

      - name: Deploy lftp — tentativa 3
        id: deploy3
        if: steps.deploy1.outcome != 'success' && steps.deploy2.outcome != 'success'
        continue-on-error: true
        run: ./scripts/deploy_lftp_upload.sh 3

      - name: Verificar ficheiros críticos no servidor (SHA-256)
        id: verify_hashes
        if: steps.deploy1.outcome == 'success' || steps.deploy2.outcome == 'success' || steps.deploy3.outcome == 'success'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER_PROD }}
          FTP_USER: ${{ secrets.FTP_USER_PROD }}
          FTP_PASS: ${{ secrets.FTP_PASS_PROD }}
        run: php scripts/verify_ftp_deploy_hashes.php

      - name: Resumo do deploy
        if: always()
        run: |
          echo "📊 Resumo das tentativas:"
          echo "   Tentativa 1: ${{ steps.deploy1.conclusion }}"
          echo "   Tentativa 2: ${{ steps.deploy2.conclusion }}"
          echo "   Tentativa 3: ${{ steps.deploy3.conclusion }}"
          echo "   Verificação SHA-256: ${{ steps.verify_hashes.conclusion }}"
          echo ""
          if [ "${{ steps.verify_hashes.conclusion }}" = "success" ]; then
            echo "✅ Deploy validado — código no servidor coincide com o Git."
            echo "   Nenhum ficheiro foi apagado no servidor (upload only)."
          elif [ "${{ steps.deploy1.conclusion }}" = "success" ] || [ "${{ steps.deploy2.conclusion }}" = "success" ] || [ "${{ steps.deploy3.conclusion }}" = "success" ]; then
            echo "⚠️ Upload concluído mas verificação SHA-256 falhou."
          else
            echo "❌ Todas as tentativas lftp falharam."
          fi

      - name: Resultado final
        if: always()
        run: |
          ok=0
          if [ "${{ steps.deploy1.conclusion }}" = "success" ] || [ "${{ steps.deploy2.conclusion }}" = "success" ] || [ "${{ steps.deploy3.conclusion }}" = "success" ]; then
            ok=1
          fi
          if [ "$ok" -eq 0 ]; then
            echo "❌ FALHA — nenhuma tentativa lftp completou."
            exit 1
          fi
          if [ "${{ steps.verify_hashes.conclusion }}" != "success" ]; then
            echo "❌ FALHA — ficheiros críticos no servidor divergem do Git."
            exit 1
          fi
          echo "🎯 SUCESSO — deploy seguro concluído."
