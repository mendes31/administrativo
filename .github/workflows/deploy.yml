name: Deploy PHP para Kinghost (Via SSH/Rsync)

# Este workflow utiliza SSH (porta 22) para ignorar as travas do arquivo .ftpaccess
# e garantir o deploy mesmo em ambiente compartilhado restrito.

on:
  push:
    branches:
      - main
      - dev-master
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Instalar SSHPass e Rsync
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass rsync

      - name: Deploy via Rsync (Porta 22)
        env:
          # Usando os dados que você confirmou via SSH
          SSH_USER: "tiaraju"
          SSHPASS: ${{ secrets.FTP_PASS_PROD }}
          SSH_HOST: "web119.kinghost.net"
          DEST_PATH: "/home/tiaraju/www/administrativo/"
        run: |
          echo "🚀 Iniciando deploy via Rsync sobre SSH..."
          echo "📁 Destino: $SSH_HOST:$DEST_PATH"
          
          # sshpass injeta a senha de forma segura no rsync
          # -o StrictHostKeyChecking=no evita que o runner pare pedindo confirmação de segurança
          # --delete remove arquivos no servidor que não existem mais no repositório (opcional)
          
          sshpass -e rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=no -p 22" \
            --exclude='.git*' \
            --exclude='.github*' \
            --exclude='.env' \
            --exclude='.ftpaccess' \
            --exclude='node_modules/' \
            --exclude='vendor/' \
            --exclude='*.log' \
            ./ $SSH_USER@$SSH_HOST:$DEST_PATH

      - name: Feedback Final
        if: success()
        run: echo "✅ Deploy realizado com sucesso via SSH!"

      - name: Relatório de Erro
        if: failure()
        run: |
          echo "❌ O deploy via SSH falhou."
          echo "Verifique se a senha no Secret 'FTP_PASS_PROD' está correta para o usuário tiaraju."