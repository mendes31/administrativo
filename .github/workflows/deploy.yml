name: Deploy PHP para Kinghost (Deploy Incremental Inteligente)

on:
  push:
    branches:
      - main
      - dev-master
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      # Estratégia 1: Deploy incremental inteligente com verificação
      - name: Deploy Incremental - Tentativa 1
        id: deploy1
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./
          server-dir: ./administrativo/
          dangerous-clean-slate: false
          log-level: verbose
          timeout: 300000  # 5 minutos
          exclude: |
            .git/
            .git/**
            .github/
            .github/**
            .gitignore
            .DS_Store
            README.md
            LICENSE.txt
            node_modules/
            node_modules/**
            .vscode/
            .vscode/**
            logs/
            logs/**
            vendor/
            vendor/**

      # Verificação e deploy incremental da tentativa 2
      - name: Deploy Incremental - Tentativa 2
        if: failure() && steps.deploy1.outcome == 'failure'
        id: deploy2
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./
          server-dir: ./administrativo/
          dangerous-clean-slate: false
          log-level: verbose
          timeout: 300000
          exclude: |
            .git/
            .git/**
            .github/
            .github/**
            .gitignore
            .DS_Store
            README.md
            LICENSE.txt
            node_modules/
            node_modules/**
            .vscode/
            .vscode/**
            logs/
            logs/**
            vendor/
            vendor/**

      # Verificação e deploy incremental da tentativa 3
      - name: Deploy Incremental - Tentativa 3
        if: failure() && steps.deploy2.outcome == 'failure'
        id: deploy3
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./
          server-dir: ./administrativo/
          dangerous-clean-slate: false
          log-level: verbose
          timeout: 300000
          exclude: |
            .git/
            .git/**
            .github/
            .github/**
            .gitignore
            .DS_Store
            README.md
            LICENSE.txt
            node_modules/
            node_modules/**
            .vscode/
            .vscode/**
            logs/
            logs/**
            vendor/
            vendor/**

      # Verificação e deploy incremental da tentativa 4
      - name: Deploy Incremental - Tentativa 4
        if: failure() && steps.deploy3.outcome == 'failure'
        id: deploy4
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./
          server-dir: ./administrativo/
          dangerous-clean-slate: false
          log-level: verbose
          timeout: 300000
          exclude: |
            .git/
            .git/**
            .github/
            .github/**
            .gitignore
            .DS_Store
            README.md
            LICENSE.txt
            node_modules/
            node_modules/**
            .vscode/
            .vscode/**
            logs/
            logs/**
            vendor/
            vendor/**

      # Verificação e deploy incremental da tentativa 5
      - name: Deploy Incremental - Tentativa 5
        if: failure() && steps.deploy4.outcome == 'failure'
        id: deploy5
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./
          server-dir: ./administrativo/
          dangerous-clean-slate: false
          log-level: verbose
          timeout: 300000
          exclude: |
            .git/
            .git/**
            .github/
            .github/**
            .gitignore
            .DS_Store
            README.md
            LICENSE.txt
            node_modules/
            node_modules/**
            .vscode/
            .vscode/**
            logs/
            logs/**
            vendor/
            vendor/**

      # Estratégia 2: Fallback lftp com verificação incremental
      - name: Install lftp (Fallback Inteligente)
        if: failure() && steps.deploy5.outcome == 'failure'
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy via lftp (Fallback Incremental)
        if: failure() && steps.deploy5.outcome == 'failure'
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          echo "🚨 FTP falhou 5 vezes, usando lftp incremental..."
          echo "📁 Verificando arquivos existentes e enviando apenas o que falta..."
          
          # Deploy incremental com lftp (--only-newer e --continue)
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<'EOF'
          set ftp:passive-mode true
          set ftp:ssl-allow no
          set net:timeout 120
          set net:max-retries 50
          set net:reconnect-interval-base 2
          set net:reconnect-interval-max 10
          set net:idle 60
          set xfer:clobber on
          
          echo "🔄 Iniciando deploy incremental..."
          echo "📋 Usando --only-newer para enviar apenas arquivos novos/modificados"
          echo "📋 Usando --continue para continuar transferências interrompidas"
          echo "📋 Usando --verbose para mostrar cada arquivo processado"
          echo ""
          echo "📊 FLAGS lftp utilizadas:"
          echo "   --only-newer: Envia apenas arquivos mais recentes/modificados"
          echo "   --continue: Continua transferências interrompidas"
          echo "   --verbose: Mostra detalhes de cada arquivo"
          echo "   --no-perms: Não perde tempo com permissões"
          echo ""
          
          mirror -R --parallel=1 --only-newer --continue --no-perms --verbose \
            --exclude-glob .git/** \
            --exclude-glob .github/** \
            --exclude-glob .gitignore \
            --exclude-glob .env \
            --exclude-glob logs/** \
            --exclude-glob vendor/** \
            --exclude-glob node_modules/** \
            --exclude-glob .vscode/** \
            ./ administrativo
          
          echo ""
          echo "✅ Deploy lftp incremental concluído!"
          echo "📊 Resumo do que foi enviado:"
          echo "   🆕 Arquivos novos: Enviados pela primeira vez"
          echo "   🔄 Arquivos modificados: Atualizados no servidor"
          echo "   ⏭️ Arquivos idênticos: Pulados (já existiam)"
          quit
          EOF

      # Verificação final e relatório de integridade detalhado
      - name: Verificar Deploy e Gerar Relatório Detalhado
        if: always()
        run: |
          echo "🔍 === RELATÓRIO DE DEPLOY DETALHADO ==="
          
          if [ "${{ steps.deploy1.outcome }}" == "success" ] || [ "${{ steps.deploy2.outcome }}" == "success" ] || [ "${{ steps.deploy3.outcome }}" == "success" ] || [ "${{ steps.deploy4.outcome }}" == "success" ] || [ "${{ steps.deploy5.outcome }}" == "success" ]; then
            echo "✅ Deploy FTP bem-sucedido!"
            echo "📊 Tentativas utilizadas:"
            [ "${{ steps.deploy1.outcome }}" == "success" ] && echo "   - Tentativa 1: ✅"
            [ "${{ steps.deploy2.outcome }}" == "success" ] && echo "   - Tentativa 2: ✅"
            [ "${{ steps.deploy3.outcome }}" == "success" ] && echo "   - Tentativa 3: ✅"
            [ "${{ steps.deploy4.outcome }}" == "success" ] && echo "   - Tentativa 4: ✅"
            [ "${{ steps.deploy5.outcome }}" == "success" ] && echo "   - Tentativa 5: ✅"
          else
            echo "⚠️ Deploy FTP falhou, mas lftp foi executado como fallback"
            echo "📊 Tentativas FTP: ❌❌❌❌❌"
            echo "🔄 Fallback lftp: ✅"
          fi
          
          echo ""
          echo "📋 Próximos passos no servidor:"
          echo "1. Acesse via SSH ou painel KingHost"
          echo "2. Execute: cd administrativo"
          echo "3. Execute: composer install --no-dev --optimize-autoloader"
          echo "4. Configure .env com URL_ADM correta"
          echo "5. Execute: php scripts/generate-htaccess.php"
          echo "6. Verifique permissões: chmod 755 public/uploads/"
          echo ""
          echo "🔍 Verificação de integridade:"
          echo "   - app/adms/Controllers/ (deve ter todos os arquivos .php)"
          echo "   - app/adms/Models/ (deve ter todos os arquivos .php)"
          echo "   - app/adms/Views/ (deve ter todas as pastas e arquivos)"
          echo "   - app/Helpers/ (deve ter todos os arquivos .php)"
          echo "   - routes/ (deve ter todos os arquivos .php)"
          echo "   - public/ (deve ter todas as pastas e arquivos)"
          echo "   - scripts/ (deve ter todos os arquivos .php)"
          echo ""
          echo "💡 Dica: O deploy foi INCREMENTAL - apenas arquivos novos/modificados foram enviados"
          echo "💡 Dica: Use 'dangerous-clean-slate: false' para continuar onde parou"
          echo ""
          echo "📊 === DETALHAMENTO DO DEPLOY INCREMENTAL ==="
          echo "🔄 Como funciona o deploy incremental:"
          echo "   ✅ Arquivo NÃO existe no servidor → ENVIA (primeira vez)"
          echo "   🔄 Arquivo existe mas foi MODIFICADO → ATUALIZA (sobrescreve)"
          echo "   ⏭️ Arquivo existe e é IDÊNTICO → PULA (não envia)"
          echo ""
          echo "🔍 Detecção automática:"
          echo "   📏 Tamanho do arquivo"
          echo "   📅 Data de modificação (timestamp)"
          echo "   🔐 Hash/checksum (quando disponível)"
          echo ""
          echo "⚡ Benefícios:"
          echo "   🚀 Muito mais rápido (só envia diferenças)"
          echo "   💾 Economiza banda (não repete arquivos)"
          echo "   🛡️ Preserva progresso (continua onde parou)"
          echo "   🔄 Sempre atualiza o que mudou"
