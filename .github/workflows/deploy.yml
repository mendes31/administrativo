name: Deploy PHP para Kinghost (Otimizado)

on:
  push:
    branches:
      - main
      - dev-master
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Instalar lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy Incremental via lftp
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER_PROD }}
          FTP_USER: ${{ secrets.FTP_USER_PROD }}
          FTP_PASS: ${{ secrets.FTP_PASS_PROD }}
        run: |
          echo "🚀 Iniciando deploy em modo de compatibilidade..."
          
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<'EOF'
          # Configurações de Máxima Compatibilidade
          set ftp:passive-mode true
          set ftp:ssl-allow no
          set ftp:list-options -a
          set net:timeout 120
          set net:max-retries 20
          set net:reconnect-interval-base 10
          set xfer:clobber on

          # Sincronização sem paralelismo para não alertar o Firewall
          # Removido --parallel para estabilidade total
          mirror --reverse --only-newer --continue --no-perms --verbose \
            --exclude-glob .git/ \
            --exclude-glob .github/ \
            --exclude-glob .gitignore \
            --exclude-glob .env \
            --exclude-glob *.log \
            --exclude-glob vendor/ \
            --exclude-glob node_modules/ \
            --exclude-glob .vscode/ \
            ./ .
          
          quit
          EOF

      - name: Feedback Final
        if: always()
        run: |
          echo "✅ Processo de deploy finalizado."