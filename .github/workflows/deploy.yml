name: Deploy PHP para Kinghost (Estratégia Dividida)
 
on:
  push:
    branches:
      - main
      - dev-master
  workflow_dispatch: {}
 
jobs:
  deploy:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup PHP com Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3.14'
          coverage: none
          tools: composer:2.8.5

      - name: Validar PHP e Composer
        run: |
          php -v
          composer --version
          composer validate --no-check-publish

      # Dependências não serão enviadas; composer deve ser executado no servidor (SSH/cron)
 
      - name: Deploy via SCP (sem vendor)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASS }}  # ou use key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: |
            ./
            !.git/**
            !.github/**
            !.gitignore
            !.env
            !logs/**
            !vendor/**
            !node_modules/**
            !.vscode/**
            !bootstrap-5.3.3-dist/**
            !DataTables/**
            !startbootstrap-sb-admin-gh-pages/**
            !scripts/fix_urls.py
            !scripts/fix_urls.sh
          target: administrativo/
          strip_components: 0

      # Sem deploy de vendor: instale no servidor após o upload
 
      # Etapas separadas removidas; deploy único cria toda a estrutura
