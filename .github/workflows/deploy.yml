name: Deploy PHP para Kinghost (Estratégia Dividida)
 
on:
  push:
    branches:
      - main
      - dev-master
  workflow_dispatch: {}
 
jobs:
  deploy:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup PHP com Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3.14'
          coverage: none
          tools: composer:2.8.5

      - name: Validar PHP e Composer
        run: |
          php -v
          composer --version
          composer validate --no-check-publish

      # Dependências não serão enviadas; composer deve ser executado no servidor (SSH/cron)
 
      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy via lftp (SFTP incremental)
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASS: ${{ secrets.SFTP_PASS }}
        run: |
          lftp -u "$SFTP_USER","$SFTP_PASS" sftp://$SFTP_HOST:22 <<'EOF'
          set sftp:auto-confirm yes
          set net:timeout 30
          set net:max-retries 10
          set net:reconnect-interval-base 5
          set net:reconnect-interval-max 60
          set net:idle 15
          set xfer:clobber on

          # garantir que o diretório remoto exista
          mkdir -p administrativo || true

          mirror -R \
            --parallel=2 \
            --only-newer \
            --continue \
            --no-perms \
            --create-dirs \
            --exclude-glob .git/** \
            --exclude-glob .github/** \
            --exclude-glob .gitignore \
            --exclude-glob .env \
            --exclude-glob logs/** \
            --exclude-glob vendor/** \
            --exclude-glob node_modules/** \
            --exclude-glob .vscode/** \
            --exclude-glob bootstrap-5.3.3-dist/** \
            --exclude-glob DataTables/** \
            --exclude-glob startbootstrap-sb-admin-gh-pages/** \
            --exclude-glob scripts/fix_urls.py \
            --exclude-glob scripts/fix_urls.sh \
            ./ administrativo/
          quit
          EOF

      # Sem deploy de vendor: instale no servidor após o upload
 
      # Etapas separadas removidas; deploy único cria toda a estrutura
