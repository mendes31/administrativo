name: Deploy PHP para Kinghost (rápido + seguro)

# 1) Deploy rápido: git diff OU manifesto fixo (institutional-user).
# 2) Se falhar: lftp só desses ficheiros.
# 3) Se ainda falhar: FTP-Deploy-Action incremental.
# 4) Verificação SHA-256 só dos ficheiros enviados (hash LF normalizado).
#
# Re-deploy manual: workflow_dispatch + feature_manifest=institutional-user

on:
  push:
    branches:
      - main
      - dev-master
  workflow_dispatch:
    inputs:
      feature_manifest:
        description: 'Manifesto fixo (re-deploy de ficheiros em falta no servidor)'
        required: false
        type: choice
        options:
          - ''
          - institutional-user
      git_before:
        description: 'Commit anterior (opcional, com git diff)'
        required: false
        type: string
      git_after:
        description: 'Commit destino (opcional, default HEAD)'
        required: false
        type: string

concurrency:
  group: deploy-kinghost-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      FTP_REMOTE_BASE: ''
      DEPLOY_FTP_RETRIES: '4'
      DEPLOY_FEATURE_MANIFEST: ${{ github.event.inputs.feature_manifest || '' }}

    steps:
      - name: Checkout código
        uses: actions/checkout@v6
        with:
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && 0 || 2 }}

      - name: Verificar Secrets FTP
        run: |
          if [ -z "${{ secrets.FTP_SERVER_PROD }}" ] || [ -z "${{ secrets.FTP_USER_PROD }}" ] || [ -z "${{ secrets.FTP_PASS_PROD }}" ]; then
            echo "❌ Secrets FTP incompletos"
            exit 1
          fi
          echo "✅ Secrets FTP configurados"

      - name: Deploy rápido — ficheiros deste push
        id: deploy_fast
        continue-on-error: true
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER_PROD }}
          FTP_USER: ${{ secrets.FTP_USER_PROD }}
          FTP_PASS: ${{ secrets.FTP_PASS_PROD }}
          GIT_BEFORE: ${{ github.event.inputs.git_before || github.event.before }}
          GIT_AFTER: ${{ github.event.inputs.git_after || github.sha }}
        run: php scripts/deploy_push_changed_files.php

      - name: Instalar lftp (fallback ficheiros do push)
        if: steps.deploy_fast.outcome != 'success'
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy lftp — só ficheiros deste push
        id: deploy_lftp_changed
        if: steps.deploy_fast.outcome != 'success'
        continue-on-error: true
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER_PROD }}
          FTP_USER: ${{ secrets.FTP_USER_PROD }}
          FTP_PASS: ${{ secrets.FTP_PASS_PROD }}
          GIT_BEFORE: ${{ github.event.inputs.git_before || github.event.before }}
          GIT_AFTER: ${{ github.event.inputs.git_after || github.sha }}
        run: php scripts/deploy_push_changed_lftp.php

      - name: Reparar ficheiros app em falta (institutional-user)
        id: deploy_repair
        if: (steps.deploy_fast.outcome == 'success' || steps.deploy_lftp_changed.outcome == 'success') && github.event.inputs.feature_manifest != 'institutional-user'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER_PROD }}
          FTP_USER: ${{ secrets.FTP_USER_PROD }}
          FTP_PASS: ${{ secrets.FTP_PASS_PROD }}
        run: php scripts/deploy_ensure_gate_files.php

      - name: Deploy incremental — tentativa 1
        id: deploy1
        if: steps.deploy_fast.outcome != 'success' && steps.deploy_lftp_changed.outcome != 'success'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER_PROD }}
          username: ${{ secrets.FTP_USER_PROD }}
          password: ${{ secrets.FTP_PASS_PROD }}
          local-dir: ./
          server-dir: ./
          dangerous-clean-slate: false
          log-level: standard
          timeout: 900000
          exclude: |
            .git/
            .git/**
            .github/
            .github/**
            .gitignore
            .DS_Store
            LICENSE.txt
            node_modules/
            node_modules/**
            .vscode/
            .vscode/**
            **/*.log
            vendor/
            vendor/**
            lib/
            lib/**
            storage/sst/epi_fichas/**
            storage/sst/attachments/**
            storage/lgpd/consentimentos/**
            storage/private/payroll/**
            !storage/private/payroll/.gitkeep
            storage/cache/**
            storage/logs/**
            logs/**
            app/storage/cache/**
            app/storage/logs/**
            public/adms/uploads/**
            .env

      - name: Aguardar retry (20s)
        if: steps.deploy_fast.outcome != 'success' && steps.deploy_lftp_changed.outcome != 'success' && steps.deploy1.outcome != 'success'
        run: sleep 20

      - name: Deploy incremental — tentativa 2
        id: deploy2
        if: steps.deploy_fast.outcome != 'success' && steps.deploy_lftp_changed.outcome != 'success' && steps.deploy1.outcome != 'success'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER_PROD }}
          username: ${{ secrets.FTP_USER_PROD }}
          password: ${{ secrets.FTP_PASS_PROD }}
          local-dir: ./
          server-dir: ./
          dangerous-clean-slate: false
          log-level: standard
          timeout: 900000
          exclude: |
            .git/
            .git/**
            .github/
            .github/**
            .gitignore
            .DS_Store
            LICENSE.txt
            node_modules/
            node_modules/**
            .vscode/
            .vscode/**
            **/*.log
            vendor/
            vendor/**
            lib/
            lib/**
            storage/sst/epi_fichas/**
            storage/sst/attachments/**
            storage/lgpd/consentimentos/**
            storage/private/payroll/**
            !storage/private/payroll/.gitkeep
            storage/cache/**
            storage/logs/**
            logs/**
            app/storage/cache/**
            app/storage/logs/**
            public/adms/uploads/**
            .env

      - name: Fallback lftp — upload only (repositório completo)
        id: deploy_lftp
        if: steps.deploy_fast.outcome != 'success' && steps.deploy_lftp_changed.outcome != 'success' && steps.deploy1.outcome != 'success' && steps.deploy2.outcome != 'success'
        continue-on-error: true
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER_PROD }}
          FTP_USER: ${{ secrets.FTP_USER_PROD }}
          FTP_PASS: ${{ secrets.FTP_PASS_PROD }}
        run: |
          chmod +x scripts/deploy_lftp_upload.sh
          ./scripts/deploy_lftp_upload.sh fallback

      - name: Verificar ficheiros críticos (SHA-256)
        id: verify_hashes
        if: steps.deploy_fast.outcome == 'success' || steps.deploy_lftp_changed.outcome == 'success' || steps.deploy1.outcome == 'success' || steps.deploy2.outcome == 'success' || steps.deploy_lftp.outcome == 'success'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER_PROD }}
          FTP_USER: ${{ secrets.FTP_USER_PROD }}
          FTP_PASS: ${{ secrets.FTP_PASS_PROD }}
          GIT_BEFORE: ${{ github.event.inputs.git_before || github.event.before }}
          GIT_AFTER: ${{ github.event.inputs.git_after || github.sha }}
          DEPLOY_VERIFY_MODE: ${{ (steps.deploy1.outcome == 'success' || steps.deploy2.outcome == 'success' || steps.deploy_lftp.outcome == 'success') && 'full' || 'changed' }}
        run: php scripts/verify_ftp_deploy_hashes.php

      - name: Actualizar estado FTP-Deploy (opcional, máx. 3 min)
        if: steps.verify_hashes.outcome == 'success'
        continue-on-error: true
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER_PROD }}
          FTP_USER: ${{ secrets.FTP_USER_PROD }}
          FTP_PASS: ${{ secrets.FTP_PASS_PROD }}
        run: |
          timeout 180 php scripts/upload_ftp_sync_state.php || {
            echo "⚠️ Estado FTP ignorado (timeout ou falha) — não bloqueia o deploy."
            exit 0
          }

      - name: Resumo
        if: always()
        run: |
          echo "📊 Resumo:"
          echo "   Manifesto:               ${{ github.event.inputs.feature_manifest || '(git diff)' }}"
          echo "   Deploy rápido (push):    ${{ steps.deploy_fast.conclusion }}"
          echo "   Reparo gate produção:    ${{ steps.deploy_repair.conclusion }}"
          echo "   lftp só push:            ${{ steps.deploy_lftp_changed.conclusion }}"
          echo "   Incremental tent. 1:     ${{ steps.deploy1.conclusion }}"
          echo "   Incremental tent. 2:     ${{ steps.deploy2.conclusion }}"
          echo "   Fallback lftp completo:  ${{ steps.deploy_lftp.conclusion }}"
          echo "   SHA-256:                 ${{ steps.verify_hashes.conclusion }}"

      - name: Resultado final
        if: always()
        run: |
          ok=0
          if [ "${{ steps.deploy_fast.outcome }}" = "success" ] || [ "${{ steps.deploy_lftp_changed.outcome }}" = "success" ] || [ "${{ steps.deploy1.outcome }}" = "success" ] || [ "${{ steps.deploy2.outcome }}" = "success" ] || [ "${{ steps.deploy_lftp.outcome }}" = "success" ]; then
            ok=1
          fi
          if [ "$ok" -eq 0 ]; then
            echo "❌ FALHA no deploy."
            exit 1
          fi
          if [ "${{ steps.verify_hashes.conclusion }}" != "success" ] && [ "${{ steps.deploy_repair.conclusion }}" != "success" ]; then
            echo "❌ FALHA na verificação SHA-256."
            exit 1
          fi
          echo "🎯 SUCESSO — deploy concluído."
