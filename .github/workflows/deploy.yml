name: Deploy PHP para Kinghost (Deploy Incremental Inteligente)

# Se o deploy falhar com ETIMEDOUT na porta 21: o runner do GitHub não alcança o FTP
# (firewall/hospedagem). Não é corrigível só com timeout. Ver docs/COMANDOS_SERVIDOR_SSH.md
# (seção "GitHub Actions: erro FTP ETIMEDOUT").

on:
  push:
    branches:
      - main
      - dev-master
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Antecipar mudança do GitHub Actions de Node 20 -> 24
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout código
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # Diagnóstico: Verificar se os secrets estão configurados
      - name: Verificar Secrets FTP
        run: |
          echo "🔍 === VERIFICAÇÃO DE SECRETS ==="
          if [ -z "${{ secrets.FTP_SERVER_PROD }}" ]; then
            echo "❌ ERRO: FTP_SERVER_PROD não está configurado!"
            exit 1
          fi
          if [ -z "${{ secrets.FTP_USER_PROD }}" ]; then
            echo "❌ ERRO: FTP_USER_PROD não está configurado!"
            exit 1
          fi
          if [ -z "${{ secrets.FTP_PASS_PROD }}" ]; then
            echo "❌ ERRO: FTP_PASS_PROD não está configurado!"
            exit 1
          fi
          echo "✅ Todos os secrets estão configurados"
          echo "📋 Servidor: ${{ secrets.FTP_SERVER_PROD }}"
          echo "📋 Usuário: ${{ secrets.FTP_USER_PROD }}"
          echo "📋 Senha: [OCULTA]"

      # Estratégia 1: Deploy incremental inteligente com verificação
      - name: Deploy Incremental - Tentativa 1
        id: deploy1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          # server: ${{ secrets.FTP_SERVER }}
          # username: ${{ secrets.FTP_USER }}
          # password: ${{ secrets.FTP_PASS }}
          # local-dir: ./
          # server-dir: ./administrativo/
          server: ${{ secrets.FTP_SERVER_PROD }}
          username: ${{ secrets.FTP_USER_PROD }}
          password: ${{ secrets.FTP_PASS_PROD }}
          local-dir: ./
          server-dir: ./
          dangerous-clean-slate: false
          log-level: standard
          timeout: 180000
          exclude: |
            .git/
            .git/**
            .github/
            .github/**
            .gitignore
            .DS_Store
            LICENSE.txt
            node_modules/
            node_modules/**
            .vscode/
            .vscode/**
            **/*.log
            vendor/
            vendor/**
            lib/
            lib/**
            storage/sst/epi_fichas/**
            storage/sst/attachments/**
            storage/lgpd/consentimentos/**
            storage/private/payroll/**
            !storage/private/payroll/.gitkeep
            storage/cache/**
            storage/logs/**
            logs/**
            app/storage/cache/**
            app/storage/logs/**

      # Verificação e deploy incremental da tentativa 2
      - name: Deploy Incremental - Tentativa 2
        if: always() && steps.deploy1.conclusion != 'success'
        id: deploy2
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER_PROD }}
          username: ${{ secrets.FTP_USER_PROD }}
          password: ${{ secrets.FTP_PASS_PROD }}
          local-dir: ./
          server-dir: ./
          dangerous-clean-slate: false
          log-level: standard
          timeout: 180000
          exclude: |
            .git/
            .git/**
            .github/
            .github/**
            .gitignore
            .DS_Store
            LICENSE.txt
            node_modules/
            node_modules/**
            .vscode/
            .vscode/**
            **/*.log
            vendor/
            vendor/**
            lib/
            lib/**
            storage/sst/epi_fichas/**
            storage/sst/attachments/**
            storage/lgpd/consentimentos/**
            storage/private/payroll/**
            !storage/private/payroll/.gitkeep
            storage/cache/**
            storage/logs/**
            logs/**
            app/storage/cache/**
            app/storage/logs/**

      # Verificação e deploy incremental da tentativa 3
      - name: Deploy Incremental - Tentativa 3
        if: always() && steps.deploy1.conclusion != 'success' && steps.deploy2.conclusion != 'success'
        id: deploy3
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER_PROD }}
          username: ${{ secrets.FTP_USER_PROD }}
          password: ${{ secrets.FTP_PASS_PROD }}
          local-dir: ./
          server-dir: ./
          dangerous-clean-slate: false
          log-level: standard
          timeout: 180000
          exclude: |
            .git/
            .git/**
            .github/
            .github/**
            .gitignore
            .DS_Store
            LICENSE.txt
            node_modules/
            node_modules/**
            .vscode/
            .vscode/**
            **/*.log
            vendor/
            vendor/**
            lib/
            lib/**
            storage/sst/epi_fichas/**
            storage/sst/attachments/**
            storage/lgpd/consentimentos/**
            storage/private/payroll/**
            !storage/private/payroll/.gitkeep
            storage/cache/**
            storage/logs/**
            logs/**
            app/storage/cache/**
            app/storage/logs/**

      # Verificação e deploy incremental da tentativa 4
      - name: Deploy Incremental - Tentativa 4
        if: always() && steps.deploy1.conclusion != 'success' && steps.deploy2.conclusion != 'success' && steps.deploy3.conclusion != 'success'
        id: deploy4
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER_PROD }}
          username: ${{ secrets.FTP_USER_PROD }}
          password: ${{ secrets.FTP_PASS_PROD }}
          local-dir: ./
          server-dir: ./
          dangerous-clean-slate: false
          log-level: standard
          timeout: 180000
          exclude: |
            .git/
            .git/**
            .github/
            .github/**
            .gitignore
            .DS_Store
            LICENSE.txt
            node_modules/
            node_modules/**
            .vscode/
            .vscode/**
            **/*.log
            vendor/
            vendor/**
            lib/
            lib/**
            storage/sst/epi_fichas/**
            storage/sst/attachments/**
            storage/lgpd/consentimentos/**
            storage/private/payroll/**
            !storage/private/payroll/.gitkeep
            storage/cache/**
            storage/logs/**
            logs/**
            app/storage/cache/**
            app/storage/logs/**

      # Verificação e deploy incremental da tentativa 5
      - name: Deploy Incremental - Tentativa 5
        if: always() && steps.deploy1.conclusion != 'success' && steps.deploy2.conclusion != 'success' && steps.deploy3.conclusion != 'success' && steps.deploy4.conclusion != 'success'
        id: deploy5
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER_PROD }}
          username: ${{ secrets.FTP_USER_PROD }}
          password: ${{ secrets.FTP_PASS_PROD }}
          local-dir: ./
          server-dir: ./
          dangerous-clean-slate: false
          log-level: standard
          timeout: 180000
          exclude: |
            .git/
            .git/**
            .github/
            .github/**
            .gitignore
            .DS_Store
            LICENSE.txt
            node_modules/
            node_modules/**
            .vscode/
            .vscode/**
            **/*.log
            vendor/
            vendor/**
            lib/
            lib/**
            storage/sst/epi_fichas/**
            storage/sst/attachments/**
            storage/lgpd/consentimentos/**
            storage/private/payroll/**
            !storage/private/payroll/.gitkeep
            storage/cache/**
            storage/logs/**
            logs/**
            app/storage/cache/**
            app/storage/logs/**

      # Estratégia 2: Fallback lftp só se NENHUMA das 5 tentativas FTP tiver sucesso
      # (NÃO usar "deploy5 == skipped": isso ocorre também quando deploy1..4 já deu certo e gera mirror duplicado + falha falsa)
      - name: Install lftp (Fallback Inteligente)
        if: always() && steps.deploy1.conclusion != 'success' && steps.deploy2.conclusion != 'success' && steps.deploy3.conclusion != 'success' && steps.deploy4.conclusion != 'success' && steps.deploy5.conclusion != 'success'
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy via lftp (Fallback Incremental)
        id: lftp_fallback_deploy
        continue-on-error: true
        if: always() && steps.deploy1.conclusion != 'success' && steps.deploy2.conclusion != 'success' && steps.deploy3.conclusion != 'success' && steps.deploy4.conclusion != 'success' && steps.deploy5.conclusion != 'success'
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER_PROD }}
          FTP_USER: ${{ secrets.FTP_USER_PROD }}
          FTP_PASS: ${{ secrets.FTP_PASS_PROD }}
        run: |
          echo "🚨 FTP falhou 5 vezes, usando lftp incremental..."
          echo "📁 Verificando arquivos existentes e enviando apenas o que falta..."
          
          # Deploy incremental com lftp (--only-newer e --continue)
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<'EOF'
          set cmd:fail-exit yes
          set ftp:passive-mode true
          set ftp:ssl-allow no
          set dns:order "inet inet6"
          set net:timeout 120
          set net:max-retries 50
          set net:reconnect-interval-base 2
          set net:reconnect-interval-max 10
          set net:idle 60
          set xfer:clobber on
          
          echo "🔄 Iniciando deploy incremental..."
          echo "📋 Usando --only-newer para enviar apenas arquivos novos/modificados"
          echo "📋 Usando --continue para continuar transferências interrompidas"
          echo "📋 Usando --verbose para mostrar cada arquivo processado"
          echo ""
          echo "📊 FLAGS lftp utilizadas:"
          echo "   --only-newer: Envia apenas arquivos mais recentes/modificados"
          echo "   --continue: Continua transferências interrompidas"
          echo "   --verbose: Mostra detalhes de cada arquivo"
          echo "   --no-perms: Não perde tempo com permissões"
          echo ""
          
          mirror -R --parallel=1 --only-newer --continue --no-perms --verbose \
            --exclude-glob .git/** \
            --exclude-glob .github/** \
            --exclude-glob .gitignore \
            --exclude-glob .env \
            --exclude-glob '*.log' \
            --exclude-glob '**/*.log' \
            --exclude-glob vendor/** \
            --exclude-glob lib/** \
            --exclude-glob storage/sst/epi_fichas/** \
            --exclude-glob storage/sst/attachments/** \
            --exclude-glob storage/lgpd/consentimentos/** \
            --exclude-glob storage/private/payroll/** \
            --exclude-glob storage/cache/** \
            --exclude-glob storage/logs/** \
            --exclude-glob logs/** \
            --exclude-glob node_modules/** \
            --exclude-glob .vscode/** \
            --exclude-glob .DS_Store \
            --exclude-glob LICENSE.txt \
            --exclude-glob 'app/adms/Controllers/receive copy' \
            --exclude-glob 'app/adms/Controllers/receive copy/**' \
            ./ .
          
          echo ""
          echo "✅ Deploy lftp incremental concluído!"
          echo "📊 Resumo do que foi enviado:"
          echo "   🆕 Arquivos novos: Enviados pela primeira vez"
          echo "   🔄 Arquivos modificados: Atualizados no servidor"
          echo "   ⏭️ Arquivos idênticos: Pulados (já existiam)"
          quit
          EOF

      - name: Resumo do deploy
        if: always()
        run: |
          echo "📊 Resumo das tentativas:"
          echo "   Tentativa 1: ${{ steps.deploy1.conclusion }}"
          echo "   Tentativa 2: ${{ steps.deploy2.conclusion }}"
          echo "   Tentativa 3: ${{ steps.deploy3.conclusion }}"
          echo "   Tentativa 4: ${{ steps.deploy4.conclusion }}"
          echo "   Tentativa 5: ${{ steps.deploy5.conclusion }}"
          echo "   Fallback lftp: ${{ steps.lftp_fallback_deploy.conclusion }}"
          echo ""
          if [ "${{ steps.deploy1.conclusion }}" == "success" ] || [ "${{ steps.deploy2.conclusion }}" == "success" ] || [ "${{ steps.deploy3.conclusion }}" == "success" ] || [ "${{ steps.deploy4.conclusion }}" == "success" ] || [ "${{ steps.deploy5.conclusion }}" == "success" ]; then
            echo "✅ Deploy concluído via FTP-Deploy-Action."
          elif [ "${{ steps.lftp_fallback_deploy.conclusion }}" == "success" ]; then
            echo "✅ Deploy concluído via fallback lftp."
          else
            echo "❌ Deploy não concluído."
          fi

      - name: Resultado final do deploy
        if: always()
        run: |
          ok=0
          if [ "${{ steps.deploy1.conclusion }}" = "success" ] || [ "${{ steps.deploy2.conclusion }}" = "success" ] || [ "${{ steps.deploy3.conclusion }}" = "success" ] || [ "${{ steps.deploy4.conclusion }}" = "success" ] || [ "${{ steps.deploy5.conclusion }}" = "success" ]; then
            ok=1
            echo "✅ Job aprovado: deploy FTP (SamKirkland) concluído com sucesso."
          fi
          if [ "${{ steps.lftp_fallback_deploy.conclusion }}" = "success" ]; then
            ok=1
            echo "✅ Job aprovado: deploy incremental via lftp (fallback) concluído com sucesso."
          fi
          if [ "$ok" -eq 1 ]; then
            echo "🎯 Conclusão: SUCESSO — alterações consideradas publicadas (FTP ou lftp)."
            exit 0
          fi
          echo "❌ Conclusão: FALHA — nem FTP nem lftp completaram com sucesso."
          echo "   Revise secrets, rede (ETIMEDOUT), opções do mirror lftp nos logs e docs/COMANDOS_SERVIDOR_SSH.md."
          exit 1