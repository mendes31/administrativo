name: Deploy PHP para Kinghost (Deploy Incremental Inteligente)

# Raiz FTP Kinghost: login já abre em ~/www/administrativo/ (app, index.php na raiz).
# NÃO usar server-dir: administrativo/ — cria pasta aninhada Administrativo/ e quebra deploy.
# Ver scripts/detect_ftp_deploy_root.php e scripts/deploy_config.php

on:
  push:
    branches:
      - main
      - dev-master
  workflow_dispatch:
    inputs:
      force_full_resync:
        description: 'Apagar .ftp-deploy-sync-state.json no servidor e reenviar tudo'
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-kinghost-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # Vazio = raiz da sessão FTP (~/www/administrativo/). Só use "administrativo" se o login abrir em ~/www/.
      FTP_REMOTE_BASE: ''

    steps:
      - name: Checkout código
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Verificar Secrets FTP
        run: |
          echo "🔍 === VERIFICAÇÃO DE SECRETS ==="
          if [ -z "${{ secrets.FTP_SERVER_PROD }}" ]; then
            echo "❌ ERRO: FTP_SERVER_PROD não está configurado!"
            exit 1
          fi
          if [ -z "${{ secrets.FTP_USER_PROD }}" ]; then
            echo "❌ ERRO: FTP_USER_PROD não está configurado!"
            exit 1
          fi
          if [ -z "${{ secrets.FTP_PASS_PROD }}" ]; then
            echo "❌ ERRO: FTP_PASS_PROD não está configurado!"
            exit 1
          fi
          echo "✅ Secrets FTP configurados"

      - name: Instalar lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Detectar raiz FTP (diagnóstico)
        continue-on-error: true
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER_PROD }}
          FTP_USER: ${{ secrets.FTP_USER_PROD }}
          FTP_PASS: ${{ secrets.FTP_PASS_PROD }}
          FTP_REMOTE_BASE: ''
        run: php scripts/detect_ftp_deploy_root.php

      - name: Remover estado FTP (ressync forçado)
        if: github.event_name == 'workflow_dispatch' && inputs.force_full_resync == true
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER_PROD }}
          FTP_USER: ${{ secrets.FTP_USER_PROD }}
          FTP_PASS: ${{ secrets.FTP_PASS_PROD }}
        run: |
          echo "🗑️ Removendo .ftp-deploy-sync-state.json na raiz do site..."
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<'EOF'
          set cmd:fail-exit yes
          set ftp:passive-mode true
          set ftp:ssl-allow no
          set net:timeout 120
          rm -f .ftp-deploy-sync-state.json
          quit
          EOF

      - name: Deploy FTP — tentativa 1
        id: deploy1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER_PROD }}
          username: ${{ secrets.FTP_USER_PROD }}
          password: ${{ secrets.FTP_PASS_PROD }}
          local-dir: ./
          server-dir: ./
          dangerous-clean-slate: false
          log-level: standard
          timeout: 300000
          exclude: |
            .git/
            .git/**
            .github/
            .github/**
            .gitignore
            .DS_Store
            LICENSE.txt
            node_modules/
            node_modules/**
            .vscode/
            .vscode/**
            **/*.log
            vendor/
            vendor/**
            lib/
            lib/**
            storage/sst/epi_fichas/**
            storage/sst/attachments/**
            storage/lgpd/consentimentos/**
            storage/private/payroll/**
            !storage/private/payroll/.gitkeep
            storage/cache/**
            storage/logs/**
            logs/**
            app/storage/cache/**
            app/storage/logs/**

      - name: Aguardar antes do retry FTP
        if: steps.deploy1.outcome != 'success'
        run: sleep 45

      - name: Deploy FTP — tentativa 2
        id: deploy2
        if: steps.deploy1.outcome != 'success'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER_PROD }}
          username: ${{ secrets.FTP_USER_PROD }}
          password: ${{ secrets.FTP_PASS_PROD }}
          local-dir: ./
          server-dir: ./
          dangerous-clean-slate: false
          log-level: verbose
          timeout: 300000
          exclude: |
            .git/
            .git/**
            .github/
            .github/**
            .gitignore
            .DS_Store
            LICENSE.txt
            node_modules/
            node_modules/**
            .vscode/
            .vscode/**
            **/*.log
            vendor/
            vendor/**
            lib/
            lib/**
            storage/sst/epi_fichas/**
            storage/sst/attachments/**
            storage/lgpd/consentimentos/**
            storage/private/payroll/**
            !storage/private/payroll/.gitkeep
            storage/cache/**
            storage/logs/**
            logs/**
            app/storage/cache/**
            app/storage/logs/**

      - name: Deploy via lftp (fallback — compara tamanho, não só data)
        id: lftp_deploy
        if: steps.deploy1.outcome != 'success' && steps.deploy2.outcome != 'success'
        continue-on-error: true
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER_PROD }}
          FTP_USER: ${{ secrets.FTP_USER_PROD }}
          FTP_PASS: ${{ secrets.FTP_PASS_PROD }}
        run: |
          echo "🚨 FTP-Deploy-Action falhou 2 vezes — fallback lftp (sem --only-newer)..."
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<'EOF'
          set cmd:fail-exit yes
          set ftp:passive-mode true
          set ftp:ssl-allow no
          set dns:order "inet inet6"
          set net:timeout 120
          set net:max-retries 50
          set net:reconnect-interval-base 2
          set net:reconnect-interval-max 10
          set net:idle 60
          set xfer:clobber on

          mirror -R --parallel=1 --ignore-time --continue --no-perms --verbose \
            --exclude-glob .git/** \
            --exclude-glob .github/** \
            --exclude-glob .gitignore \
            --exclude-glob .env \
            --exclude-glob '*.log' \
            --exclude-glob '**/*.log' \
            --exclude-glob vendor/** \
            --exclude-glob lib/** \
            --exclude-glob storage/sst/epi_fichas/** \
            --exclude-glob storage/sst/attachments/** \
            --exclude-glob storage/lgpd/consentimentos/** \
            --exclude-glob storage/private/payroll/** \
            --exclude-glob storage/cache/** \
            --exclude-glob storage/logs/** \
            --exclude-glob logs/** \
            --exclude-glob node_modules/** \
            --exclude-glob .vscode/** \
            --exclude-glob .DS_Store \
            --exclude-glob LICENSE.txt \
            --exclude-glob 'app/adms/Controllers/receive copy/**' \
            ./ ./
          quit
          EOF

      - name: Verificar ficheiros críticos no servidor (SHA-256)
        id: verify_hashes
        if: steps.deploy1.outcome == 'success' || steps.deploy2.outcome == 'success' || steps.lftp_deploy.outcome == 'success'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER_PROD }}
          FTP_USER: ${{ secrets.FTP_USER_PROD }}
          FTP_PASS: ${{ secrets.FTP_PASS_PROD }}
          FTP_REMOTE_BASE: ''
        run: php scripts/verify_ftp_deploy_hashes.php

      - name: Sincronizar estado FTP com o Git
        if: steps.verify_hashes.outcome == 'success'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER_PROD }}
          FTP_USER: ${{ secrets.FTP_USER_PROD }}
          FTP_PASS: ${{ secrets.FTP_PASS_PROD }}
          FTP_REMOTE_BASE: ''
        run: php scripts/upload_ftp_sync_state.php

      - name: Resumo do deploy
        if: always()
        run: |
          echo "📊 Resumo:"
          echo "   FTP tentativa 1: ${{ steps.deploy1.conclusion }}"
          echo "   FTP tentativa 2: ${{ steps.deploy2.conclusion }}"
          echo "   Fallback lftp:   ${{ steps.lftp_deploy.conclusion }}"
          echo "   Verificação:     ${{ steps.verify_hashes.conclusion }}"
          echo ""
          if [ "${{ steps.verify_hashes.conclusion }}" = "success" ]; then
            echo "✅ Deploy validado — servidor alinhado com Git."
          elif [ "${{ steps.deploy1.conclusion }}" = "success" ] || [ "${{ steps.deploy2.conclusion }}" = "success" ] || [ "${{ steps.lftp_deploy.conclusion }}" = "success" ]; then
            echo "⚠️ Deploy enviou ficheiros mas a verificação SHA-256 falhou."
            echo "   Use workflow_dispatch com force_full_resync=true ou scp manual + generate_ftp_deploy_state.php no servidor."
          else
            echo "❌ Deploy não concluído."
          fi

      - name: Resultado final do deploy
        if: always()
        run: |
          if [ "${{ steps.verify_hashes.conclusion }}" = "success" ]; then
            echo "🎯 Conclusão: SUCESSO — ficheiros críticos confirmados no servidor."
            exit 0
          fi
          if [ "${{ steps.deploy1.conclusion }}" = "success" ] || [ "${{ steps.deploy2.conclusion }}" = "success" ] || [ "${{ steps.lftp_deploy.conclusion }}" = "success" ]; then
            echo "❌ Conclusão: FALHA — deploy parcial (verificação SHA-256)."
            exit 1
          fi
          echo "❌ Conclusão: FALHA — nem FTP nem lftp completaram."
          echo "   Revise secrets, rede (ETIMEDOUT) e docs/COMANDOS_SERVIDOR_SSH.md."
          exit 1
