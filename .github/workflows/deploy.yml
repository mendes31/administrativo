name: Deploy PHP para Kinghost (Deploy Incremental Inteligente)

# Se o deploy falhar com ETIMEDOUT na porta 21: o runner do GitHub não alcança o FTP
# (firewall/hospedagem). Não é corrigível só com timeout. Ver docs/COMANDOS_SERVIDOR_SSH.md
# (seção "GitHub Actions: erro FTP ETIMEDOUT").

on:
  push:
    branches:
      - main
      - dev-master
  workflow_dispatch:
    inputs:
      ftp_server_dir:
        description: "Só em execução manual: pasta remota (barra final). Ex. administrativo/ se o FTP abrir em www/. Vazio = mesmo padrão que em push (./)"
        required: false
        type: string
        default: ""

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Igual ao fluxo que estava estável (server-dir ./): push envia para a raiz da sessão FTP.
      # Se o login cair em www/ e o site estiver em administrativo/, rode o workflow à mão com input ftp_server_dir = administrativo/
      FTP_SERVER_DIR: ${{ github.event_name == 'workflow_dispatch' && inputs.ftp_server_dir || './' }}

    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Diagnóstico: Verificar se os secrets estão configurados
      - name: Verificar Secrets FTP
        run: |
          echo "🔍 === VERIFICAÇÃO DE SECRETS ==="
          if [ -z "${{ secrets.FTP_SERVER_PROD }}" ]; then
            echo "❌ ERRO: FTP_SERVER_PROD não está configurado!"
            exit 1
          fi
          if [ -z "${{ secrets.FTP_USER_PROD }}" ]; then
            echo "❌ ERRO: FTP_USER_PROD não está configurado!"
            exit 1
          fi
          if [ -z "${{ secrets.FTP_PASS_PROD }}" ]; then
            echo "❌ ERRO: FTP_PASS_PROD não está configurado!"
            exit 1
          fi
          echo "✅ Todos os secrets estão configurados"
          echo "📋 Servidor: ${{ secrets.FTP_SERVER_PROD }}"
          echo "📋 Usuário: ${{ secrets.FTP_USER_PROD }}"
          echo "📋 Senha: [OCULTA]"
          echo "📂 Pasta remota do projeto (FTP_SERVER_DIR): $FTP_SERVER_DIR"

      # Garante server-dir normalizado + árvore remota antes do FTP-Deploy (evita 550 MKD app / Permission denied).
      - name: Preparar FTP — caminho remoto e pastas no servidor
        id: ftp_prep
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER_PROD }}
          FTP_USER: ${{ secrets.FTP_USER_PROD }}
          FTP_PASS: ${{ secrets.FTP_PASS_PROD }}
        run: |
          set -euo pipefail
          D="${FTP_SERVER_DIR:-./}"
          while [[ "$D" == ./* ]]; do D="${D#./}"; done
          while [[ "$D" == /* ]]; do D="${D#/}"; done
          [ -z "$D" ] && D="."
          case "$D" in */) ;; *) D="${D}/" ;; esac
          RAW="$D"
          echo "server_dir=$RAW" >> "$GITHUB_OUTPUT"
          echo "FTP_SERVER_DIR=$RAW" >> "$GITHUB_ENV"
          echo "📂 server-dir normalizado para o deploy: $RAW"

          R="${RAW%/}"
          if [ "$R" = "." ]; then PREFIX=""; else PREFIX="${R}/"; fi

          if ! command -v lftp &> /dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y lftp
          fi

          MK=""
          while IFS= read -r -d '' dir; do
            base="$(basename "$dir")"
            case "$base" in .git|.github|node_modules) continue ;; esac
            MK="${MK}mkdir -p ${PREFIX}${base}"$'\n'
          done < <(find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -type d -print0)

          set +e
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<EOF
          set ftp:passive-mode true
          set ftp:ssl-allow no
          set net:timeout 120
          set cmd:fail-exit no
          $MK
          quit
          EOF
          LFTP_RC=$?
          set -e
          if [ "$LFTP_RC" -ne 0 ]; then
            echo "::warning::lftp preparação terminou com código $LFTP_RC (se o deploy FTP falhar, verifique pasta e permissões no painel Kinghost)."
          fi
          echo "✅ Pastas remotas preparadas (mkdir -p em 1º nível sob ${PREFIX:-raiz FTP})."

      # Estratégia 1: Deploy incremental inteligente com verificação
      - name: Deploy Incremental - Tentativa 1
        id: deploy1
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          # server: ${{ secrets.FTP_SERVER }}
          # username: ${{ secrets.FTP_USER }}
          # password: ${{ secrets.FTP_PASS }}
          # local-dir: ./
          server: ${{ secrets.FTP_SERVER_PROD }}
          username: ${{ secrets.FTP_USER_PROD }}
          password: ${{ secrets.FTP_PASS_PROD }}
          local-dir: ./
          server-dir: ${{ steps.ftp_prep.outputs.server_dir }}
          dangerous-clean-slate: false
          log-level: verbose
          timeout: 300000  # 5 minutos (padrão que funcionava)
          exclude: |
            .git/
            .git/**
            .github/
            .github/**
            .gitignore
            .DS_Store
            LICENSE.txt
            node_modules/
            node_modules/**
            .vscode/
            .vscode/**
            **/*.log  # só arquivos .log em disco; controllers, views, migrations, seeds (.php) seguem
            vendor/
            vendor/**
            lib/
            lib/**

      # Verificação e deploy incremental da tentativa 2
      - name: Deploy Incremental - Tentativa 2
        if: failure() && steps.deploy1.outcome == 'failure'
        id: deploy2
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER_PROD }}
          username: ${{ secrets.FTP_USER_PROD }}
          password: ${{ secrets.FTP_PASS_PROD }}
          local-dir: ./
          server-dir: ${{ steps.ftp_prep.outputs.server_dir }}
          dangerous-clean-slate: false
          log-level: verbose
          timeout: 300000
          exclude: |
            .git/
            .git/**
            .github/
            .github/**
            .gitignore
            .DS_Store
            LICENSE.txt
            node_modules/
            node_modules/**
            .vscode/
            .vscode/**
            **/*.log  # só arquivos .log em disco; controllers, views, migrations, seeds (.php) seguem
            vendor/
            vendor/**
            lib/
            lib/**

      # Verificação e deploy incremental da tentativa 3
      - name: Deploy Incremental - Tentativa 3
        if: failure() && steps.deploy2.outcome == 'failure'
        id: deploy3
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER_PROD }}
          username: ${{ secrets.FTP_USER_PROD }}
          password: ${{ secrets.FTP_PASS_PROD }}
          local-dir: ./
          server-dir: ${{ steps.ftp_prep.outputs.server_dir }}
          dangerous-clean-slate: false
          log-level: verbose
          timeout: 300000
          exclude: |
            .git/
            .git/**
            .github/
            .github/**
            .gitignore
            .DS_Store
            LICENSE.txt
            node_modules/
            node_modules/**
            .vscode/
            .vscode/**
            **/*.log  # só arquivos .log em disco; controllers, views, migrations, seeds (.php) seguem
            vendor/
            vendor/**
            lib/
            lib/**

      # Verificação e deploy incremental da tentativa 4
      - name: Deploy Incremental - Tentativa 4
        if: failure() && steps.deploy3.outcome == 'failure'
        id: deploy4
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER_PROD }}
          username: ${{ secrets.FTP_USER_PROD }}
          password: ${{ secrets.FTP_PASS_PROD }}
          local-dir: ./
          server-dir: ${{ steps.ftp_prep.outputs.server_dir }}
          dangerous-clean-slate: false
          log-level: verbose
          timeout: 300000
          exclude: |
            .git/
            .git/**
            .github/
            .github/**
            .gitignore
            .DS_Store
            LICENSE.txt
            node_modules/
            node_modules/**
            .vscode/
            .vscode/**
            **/*.log  # só arquivos .log em disco; controllers, views, migrations, seeds (.php) seguem
            vendor/
            vendor/**
            lib/
            lib/**

      # Verificação e deploy incremental da tentativa 5
      - name: Deploy Incremental - Tentativa 5
        if: failure() && steps.deploy4.outcome == 'failure'
        id: deploy5
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER_PROD }}
          username: ${{ secrets.FTP_USER_PROD }}
          password: ${{ secrets.FTP_PASS_PROD }}
          local-dir: ./
          server-dir: ${{ steps.ftp_prep.outputs.server_dir }}
          dangerous-clean-slate: false
          log-level: verbose
          timeout: 300000
          exclude: |
            .git/
            .git/**
            .github/
            .github/**
            .gitignore
            .DS_Store
            LICENSE.txt
            node_modules/
            node_modules/**
            .vscode/
            .vscode/**
            **/*.log  # só arquivos .log em disco; controllers, views, migrations, seeds (.php) seguem
            vendor/
            vendor/**
            lib/
            lib/**

      # Estratégia 2: Fallback lftp só se NENHUMA das 5 tentativas FTP tiver sucesso
      # (NÃO usar "deploy5 == skipped": isso ocorre também quando deploy1..4 já deu certo e gera mirror duplicado + falha falsa)
      - name: Install lftp (Fallback Inteligente)
        if: failure() && steps.deploy1.outcome != 'success' && steps.deploy2.outcome != 'success' && steps.deploy3.outcome != 'success' && steps.deploy4.outcome != 'success' && steps.deploy5.outcome != 'success'
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy via lftp (Fallback Incremental)
        if: failure() && steps.deploy1.outcome != 'success' && steps.deploy2.outcome != 'success' && steps.deploy3.outcome != 'success' && steps.deploy4.outcome != 'success' && steps.deploy5.outcome != 'success'
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER_PROD }}
          FTP_USER: ${{ secrets.FTP_USER_PROD }}
          FTP_PASS: ${{ secrets.FTP_PASS_PROD }}
        run: |
          echo "🚨 FTP falhou 5 vezes, usando lftp incremental..."
          echo "📁 Verificando arquivos existentes e enviando apenas o que falta..."
          
          R="${FTP_SERVER_DIR#./}"
          R="${R%/}"
          if [ -z "$R" ] || [ "$R" = "." ]; then
            LFTP_ENTER=""
          else
            LFTP_ENTER=$(printf 'mkdir -p %s\ncd %s\n' "$R" "$R")
          fi
          echo "📂 FTP_SERVER_DIR=$FTP_SERVER_DIR (lftp: entrar na subpasta remota antes do mirror)"
          
          # Deploy incremental com lftp (--only-newer e --continue). Heredoc sem aspas só para expandir LFTP_ENTER; \$ preserva o $ da regex.
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<EOF
          set ftp:passive-mode true
          set ftp:ssl-allow no
          set net:timeout 120
          set net:max-retries 50
          set net:reconnect-interval-base 2
          set net:reconnect-interval-max 10
          set net:idle 60
          set xfer:clobber on
          
          echo "🔄 Iniciando deploy incremental..."
          echo "📋 Usando --only-newer para enviar apenas arquivos novos/modificados"
          echo "📋 Usando --continue para continuar transferências interrompidas"
          echo "📋 Usando --verbose para mostrar cada arquivo processado"
          echo ""
          echo "📊 FLAGS lftp utilizadas:"
          echo "   --only-newer: Envia apenas arquivos mais recentes/modificados"
          echo "   --continue: Continua transferências interrompidas"
          echo "   --verbose: Mostra detalhes de cada arquivo"
          echo "   --no-perms: Não perde tempo com permissões"
          echo ""
          $LFTP_ENTER
          mirror -R --parallel=1 --only-newer --continue --no-perms --verbose \
            --exclude-glob .git/** \
            --exclude-glob .github/** \
            --exclude-glob .gitignore \
            --exclude-glob .env \
            --exclude-regex \\.log\$ \
            --exclude-glob vendor/** \
            --exclude-glob lib/** \
            --exclude-glob node_modules/** \
            --exclude-glob .vscode/** \
            --exclude-glob .DS_Store \
            --exclude-glob LICENSE.txt \
            ./ .
          
          echo ""
          echo "✅ Deploy lftp incremental concluído!"
          echo "📊 Resumo do que foi enviado:"
          echo "   🆕 Arquivos novos: Enviados pela primeira vez"
          echo "   🔄 Arquivos modificados: Atualizados no servidor"
          echo "   ⏭️ Arquivos idênticos: Pulados (já existiam)"
          quit
          EOF

      # Captura e exibe logs detalhados do deploy
      - name: Capturar Logs Detalhados do Deploy
        if: always()
        run: |
          echo "🔍 === CAPTURA DE LOGS DETALHADOS ==="
          echo "📊 Status de cada tentativa:"
          echo "   Tentativa 1: ${{ steps.deploy1.outcome }}"
          echo "   Tentativa 2: ${{ steps.deploy2.outcome }}"
          echo "   Tentativa 3: ${{ steps.deploy3.outcome }}"
          echo "   Tentativa 4: ${{ steps.deploy4.outcome }}"
          echo "   Tentativa 5: ${{ steps.deploy5.outcome }}"
          echo ""
          echo "📋 Logs detalhados estão disponíveis em:"
          echo "   GitHub Actions → Jobs → deploy → Steps"
          echo ""
          echo "🔍 Para ver logs de arquivos específicos:"
          echo "   1. Expanda o step 'Deploy Incremental - Tentativa X'"
          echo "   2. Procure por mensagens como:"
          echo "      ✅ 'Uploading: README.md' (arquivo novo)"
          echo "      🔄 'Updating: README.md' (arquivo modificado)"
          echo "      ⏭️ 'Skipping: README.md' (arquivo idêntico)"
          echo ""
          echo "💡 Dica: Use Ctrl+F nos logs para buscar por 'README.md'"

      # Criação automática de pastas essenciais no servidor
      - name: Criar Pastas Essenciais no Servidor
        if: always()
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER_PROD }}
          FTP_USER: ${{ secrets.FTP_USER_PROD }}
          FTP_PASS: ${{ secrets.FTP_PASS_PROD }}
        run: |
          echo "🔧 === CRIAÇÃO DE PASTAS ESSENCIAIS ==="
          echo "📁 Criando pastas necessárias no servidor..."
          
          # Instalar lftp se não estiver disponível
          if ! command -v lftp &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y lftp
          fi
          
          R="${FTP_SERVER_DIR#./}"
          R="${R%/}"
          if [ -z "$R" ] || [ "$R" = "." ]; then
            MK="mkdir -p logs; mkdir -p public/uploads"
          else
            MK="mkdir -p $R/logs; mkdir -p $R/public/uploads"
          fi
          
          # Criar pastas essenciais via FTP (mesma raiz que FTP_SERVER_DIR)
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<EOF
          set ftp:passive-mode true
          set ftp:ssl-allow no
          set net:timeout 30
          
          echo "🔄 Conectando ao servidor..."
          $MK
          
          echo "✅ Pastas essenciais criadas (chmod via FTP costuma falhar em hospedagem compartilhada — ajuste no painel se precisar)"
          quit
          EOF

      # Verificação final e relatório de integridade detalhado
      - name: Verificar Deploy e Gerar Relatório Detalhado
        if: always()
        run: |
          echo "🔍 === RELATÓRIO DE DEPLOY DETALHADO ==="
          
          if [ "${{ steps.deploy1.outcome }}" == "success" ] || [ "${{ steps.deploy2.outcome }}" == "success" ] || [ "${{ steps.deploy3.outcome }}" == "success" ] || [ "${{ steps.deploy4.outcome }}" == "success" ] || [ "${{ steps.deploy5.outcome }}" == "success" ]; then
            echo "✅ Deploy FTP bem-sucedido!"
            echo "📊 Tentativas utilizadas:"
            [ "${{ steps.deploy1.outcome }}" == "success" ] && echo "   - Tentativa 1: ✅"
            [ "${{ steps.deploy2.outcome }}" == "success" ] && echo "   - Tentativa 2: ✅"
            [ "${{ steps.deploy3.outcome }}" == "success" ] && echo "   - Tentativa 3: ✅"
            [ "${{ steps.deploy4.outcome }}" == "success" ] && echo "   - Tentativa 4: ✅"
            [ "${{ steps.deploy5.outcome }}" == "success" ] && echo "   - Tentativa 5: ✅"
          else
            echo "⚠️ Deploy FTP falhou, mas lftp foi executado como fallback"
            echo "📊 Tentativas FTP: ❌❌❌❌❌"
            echo "🔄 Fallback lftp: ✅"
          fi
          
          echo ""
          echo "📋 Próximos passos no servidor:"
          echo "1. Acesse via SSH ou painel KingHost"
          echo "2. Execute: cd /files (ou caminho correto da raiz do projeto)"
          echo "3. Execute: composer install --no-dev --optimize-autoloader"
          echo "4. Configure .env com URL_ADM correta"
          echo "5. Execute: php scripts/generate-htaccess.php"
          echo "6. Verifique permissões: chmod 755 public/uploads/"
          echo ""
          echo "🔍 Verificação de integridade:"
          echo "   - app/adms/Controllers/ (deve ter todos os arquivos .php)"
          echo "   - app/adms/Models/ (deve ter todos os arquivos .php)"
          echo "   - app/adms/Views/ (deve ter todas as pastas e arquivos)"
          echo "   - app/Helpers/ (deve ter todos os arquivos .php)"
          echo "   - routes/ (deve ter todos os arquivos .php)"
          echo "   - public/ (deve ter todas as pastas e arquivos)"
          echo "   - scripts/ (deve ter todos os arquivos .php)"
          echo ""
          echo "💡 Dica: O deploy foi INCREMENTAL - apenas arquivos novos/modificados foram enviados"
          echo "💡 Dica: Use 'dangerous-clean-slate: false' para continuar onde parou"
          echo ""
          echo "📊 === DETALHAMENTO DO DEPLOY INCREMENTAL ==="
          echo "🔄 Como funciona o deploy incremental:"
          echo "   ✅ Arquivo NÃO existe no servidor → ENVIA (primeira vez)"
          echo "   🔄 Arquivo existe mas foi MODIFICADO → ATUALIZA (sobrescreve)"
          echo "   ⏭️ Arquivo existe e é IDÊNTICO → PULA (não envia)"
          echo ""
          echo "🔍 Detecção automática:"
          echo "   📏 Tamanho do arquivo"
          echo "   📅 Data de modificação (timestamp)"
          echo "   🔐 Hash/checksum (quando disponível)"
          echo ""
          echo "⚡ Benefícios:"
          echo "   🚀 Muito mais rápido (só envia diferenças)"
          echo "   💾 Economiza banda (não repete arquivos)"
          echo "   🛡️ Preserva progresso (continua onde parou)"
          echo "   🔄 Sempre atualiza o que mudou"
          echo ""
          echo "🔍 === COMO VER OS LOGS DETALHADOS ==="
          echo "📋 Para ver logs detalhados em tempo real:"
          echo "1. Clique no job 'deploy' no GitHub Actions"
          echo "2. Clique no step 'Deploy Incremental - Tentativa X'"
          echo "3. Expanda os logs para ver cada arquivo sendo processado"
          echo "4. Procure por mensagens como:"
          echo "   - 'Uploading: arquivo.php' (arquivo novo)"
          echo "   - 'Updating: arquivo.php' (arquivo modificado)"
          echo "   - 'Skipping: arquivo.php' (arquivo idêntico)"
          echo ""
          echo "💡 Dica: Os logs 'verbose' mostram TUDO, mas podem ser longos"
          echo "💡 Dica: Use Ctrl+F para buscar por arquivos específicos nos logs"
