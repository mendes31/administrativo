- name: Deploy via Rsync com Senha
        env:
          SSH_PASS: ${{ secrets.FTP_PASS_PROD }} # Sua senha do SSH
          SSH_USER: "tiaraju"                    # Seu usuário do SSH
          SSH_HOST: "web119.kinghost.net"        # Host correto do SSH
        run: |
          echo "🚀 Iniciando deploy via SSH em web119.kinghost.net..."
          
          sshpass -e rsync -avz --delete \
            -e "ssh -p 22 -o StrictHostKeyChecking=no" \
            --exclude='.git*' \
            --exclude='.github*' \
            --exclude='.env' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='*.log' \
            ./ $SSH_USER@$SSH_HOST:/home/tiaraju/www/administrativo/