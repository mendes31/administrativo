name: Deploy PHP para Kinghost (incremental + seguro)

# Caminho rápido: FTP-Deploy-Action (hash + .ftp-deploy-sync-state.json) — só envia alterados (~15–30s).
# Fallback: lftp upload-only (sem --delete) se o FTP falhar por timeout.
#
# Segurança: public/adms/uploads/**, .env e dados de produção estão em exclude
# (nunca enviados nem apagados). dangerous-clean-slate: false. Sem force_full_resync.
#
# Raiz FTP: login abre em ~/www/administrativo/ → server-dir ./

on:
  push:
    branches:
      - main
      - dev-master
  workflow_dispatch:

concurrency:
  group: deploy-kinghost-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      FTP_REMOTE_BASE: ''

    steps:
      - name: Checkout código
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Verificar Secrets FTP
        run: |
          if [ -z "${{ secrets.FTP_SERVER_PROD }}" ] || [ -z "${{ secrets.FTP_USER_PROD }}" ] || [ -z "${{ secrets.FTP_PASS_PROD }}" ]; then
            echo "❌ Secrets FTP incompletos"
            exit 1
          fi
          echo "✅ Secrets FTP configurados"

      - name: Instalar lftp (fallback)
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy incremental — tentativa 1
        id: deploy1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER_PROD }}
          username: ${{ secrets.FTP_USER_PROD }}
          password: ${{ secrets.FTP_PASS_PROD }}
          local-dir: ./
          server-dir: ./
          dangerous-clean-slate: false
          log-level: standard
          timeout: 300000
          exclude: |
            .git/
            .git/**
            .github/
            .github/**
            .gitignore
            .DS_Store
            LICENSE.txt
            node_modules/
            node_modules/**
            .vscode/
            .vscode/**
            **/*.log
            vendor/
            vendor/**
            lib/
            lib/**
            storage/sst/epi_fichas/**
            storage/sst/attachments/**
            storage/lgpd/consentimentos/**
            storage/private/payroll/**
            !storage/private/payroll/.gitkeep
            storage/cache/**
            storage/logs/**
            logs/**
            app/storage/cache/**
            app/storage/logs/**
            public/adms/uploads/**
            .env

      - name: Aguardar antes do retry (30s)
        if: steps.deploy1.outcome != 'success'
        run: sleep 30

      - name: Deploy incremental — tentativa 2
        id: deploy2
        if: steps.deploy1.outcome != 'success'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER_PROD }}
          username: ${{ secrets.FTP_USER_PROD }}
          password: ${{ secrets.FTP_PASS_PROD }}
          local-dir: ./
          server-dir: ./
          dangerous-clean-slate: false
          log-level: verbose
          timeout: 300000
          exclude: |
            .git/
            .git/**
            .github/
            .github/**
            .gitignore
            .DS_Store
            LICENSE.txt
            node_modules/
            node_modules/**
            .vscode/
            .vscode/**
            **/*.log
            vendor/
            vendor/**
            lib/
            lib/**
            storage/sst/epi_fichas/**
            storage/sst/attachments/**
            storage/lgpd/consentimentos/**
            storage/private/payroll/**
            !storage/private/payroll/.gitkeep
            storage/cache/**
            storage/logs/**
            logs/**
            app/storage/cache/**
            app/storage/logs/**
            public/adms/uploads/**
            .env

      - name: Aguardar antes do fallback lftp (30s)
        if: steps.deploy1.outcome != 'success' && steps.deploy2.outcome != 'success'
        run: sleep 30

      - name: Fallback lftp — upload only (sem --delete)
        id: deploy_lftp
        if: steps.deploy1.outcome != 'success' && steps.deploy2.outcome != 'success'
        continue-on-error: true
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER_PROD }}
          FTP_USER: ${{ secrets.FTP_USER_PROD }}
          FTP_PASS: ${{ secrets.FTP_PASS_PROD }}
        run: |
          chmod +x scripts/deploy_lftp_upload.sh
          ./scripts/deploy_lftp_upload.sh fallback

      - name: Verificar ficheiros críticos no servidor (SHA-256)
        id: verify_hashes
        if: steps.deploy1.outcome == 'success' || steps.deploy2.outcome == 'success' || steps.deploy_lftp.outcome == 'success'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER_PROD }}
          FTP_USER: ${{ secrets.FTP_USER_PROD }}
          FTP_PASS: ${{ secrets.FTP_PASS_PROD }}
          FTP_REMOTE_BASE: ''
        run: php scripts/verify_ftp_deploy_hashes.php

      - name: Resumo do deploy
        if: always()
        run: |
          echo "📊 Resumo:"
          echo "   Incremental tentativa 1: ${{ steps.deploy1.conclusion }}"
          echo "   Incremental tentativa 2: ${{ steps.deploy2.conclusion }}"
          echo "   Fallback lftp:           ${{ steps.deploy_lftp.conclusion }}"
          echo "   Verificação SHA-256:     ${{ steps.verify_hashes.conclusion }}"
          if [ "${{ steps.deploy1.conclusion }}" = "success" ] || [ "${{ steps.deploy2.conclusion }}" = "success" ]; then
            echo ""
            echo "⚡ Deploy incremental (hash) — rápido, só ficheiros alterados."
          fi
          if [ "${{ steps.verify_hashes.conclusion }}" = "success" ]; then
            echo "✅ Código no servidor coincide com o Git. Uploads (.env) protegidos em exclude."
          fi

      - name: Resultado final
        if: always()
        run: |
          ok=0
          if [ "${{ steps.deploy1.conclusion }}" = "success" ] || [ "${{ steps.deploy2.conclusion }}" = "success" ] || [ "${{ steps.deploy_lftp.conclusion }}" = "success" ]; then
            ok=1
          fi
          if [ "$ok" -eq 0 ]; then
            echo "❌ FALHA — incremental e fallback lftp falharam."
            exit 1
          fi
          if [ "${{ steps.verify_hashes.conclusion }}" != "success" ]; then
            echo "❌ FALHA — verificação SHA-256."
            exit 1
          fi
          echo "🎯 SUCESSO — deploy concluído."
