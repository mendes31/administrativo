name: Deploy Producao KingHost (FTPS)

on:
  push:
    branches:
      - main
      - dev-master
  workflow_dispatch:
    inputs:
      remote_dir:
        description: "Diretorio remoto no FTP (use '.' para raiz da sessao)"
        required: false
        default: "."
        type: string
      run_diagnostics:
        description: "Executar diagnostico FTP (pwd/ls/state)"
        required: false
        default: false
        type: boolean
      force_lftp_fallback:
        description: "Forcar fallback lftp mesmo com FTP ok"
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-kinghost-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      FTP_HOST: ${{ secrets.FTP_SERVER_PROD }}
      FTP_USER: ${{ secrets.FTP_USER_PROD }}
      FTP_PASS: ${{ secrets.FTP_PASS_PROD }}
      REMOTE_DIR_RAW: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.remote_dir || '.' }}
      FORCE_LFTP_FALLBACK: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_lftp_fallback || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validar secrets e normalizar paths
        run: |
          set -euo pipefail

          [ -n "${FTP_HOST:-}" ] || { echo "ERRO: FTP_SERVER_PROD ausente"; exit 1; }
          [ -n "${FTP_USER:-}" ] || { echo "ERRO: FTP_USER_PROD ausente"; exit 1; }
          [ -n "${FTP_PASS:-}" ] || { echo "ERRO: FTP_PASS_PROD ausente"; exit 1; }

          REMOTE="${REMOTE_DIR_RAW:-.}"
          REMOTE="${REMOTE#"${REMOTE%%[![:space:]]*}"}"
          REMOTE="${REMOTE%"${REMOTE##*[![:space:]]}"}"

          if [ -z "$REMOTE" ] || [ "$REMOTE" = "/" ] || [ "$REMOTE" = "./" ]; then
            REMOTE="."
          fi

          if [ "$REMOTE" = "." ]; then
            SERVER_DIR="./"
            LFTP_TARGET="."
          else
            REMOTE="${REMOTE#/}"
            REMOTE="${REMOTE%/}"
            SERVER_DIR="${REMOTE}/"
            LFTP_TARGET="$REMOTE"
          fi

          echo "REMOTE_DIR_NORMALIZED=$REMOTE" >> "$GITHUB_ENV"
          echo "SERVER_DIR=$SERVER_DIR" >> "$GITHUB_ENV"
          echo "LFTP_TARGET=$LFTP_TARGET" >> "$GITHUB_ENV"

      - name: Diagnostico FTP (opcional)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_diagnostics == 'true'
        continue-on-error: true
        run: |
          set +e
          if ! command -v lftp >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          fi
          lftp <<EOF
          set cmd:fail-exit no
          set dns:order "inet inet6"
          set ftp:passive-mode true
          set ssl:verify-certificate no
          set ftp:ssl-force true
          set net:timeout 25
          set net:max-retries 2
          open -u "$FTP_USER","$FTP_PASS" ftp://$FTP_HOST
          pwd
          cls -1 | head -120
          [ "$REMOTE_DIR_NORMALIZED" != "." ] && cd "$REMOTE_DIR_NORMALIZED"
          cls -1 .ftp-deploy-sync-state.json
          quit
          EOF

      - name: Deploy incremental (tentativa 1)
        id: deploy1
        timeout-minutes: 20
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ env.FTP_HOST }}
          username: ${{ env.FTP_USER }}
          password: ${{ env.FTP_PASS }}
          protocol: ftps
          security: loose
          local-dir: ./
          server-dir: ${{ env.SERVER_DIR }}
          timeout: 300000
          log-level: standard
          dangerous-clean-slate: false
          exclude: |
            .git/
            .git/**
            .github/
            .github/**
            .vscode/
            .vscode/**
            node_modules/
            node_modules/**
            vendor/
            vendor/**
            lib/
            lib/**
            .env
            .gitignore
            .DS_Store
            LICENSE.txt
            administrativo/
            administrativo/**
            **/*.log
            **/receive copy/**
            **/receive%20copy/**
            **/* copy.php

      - name: Deploy incremental (tentativa 2)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        timeout-minutes: 20
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ env.FTP_HOST }}
          username: ${{ env.FTP_USER }}
          password: ${{ env.FTP_PASS }}
          protocol: ftps
          security: loose
          local-dir: ./
          server-dir: ${{ env.SERVER_DIR }}
          timeout: 300000
          log-level: standard
          dangerous-clean-slate: false
          exclude: |
            .git/
            .git/**
            .github/
            .github/**
            .vscode/
            .vscode/**
            node_modules/
            node_modules/**
            vendor/
            vendor/**
            lib/
            lib/**
            .env
            .gitignore
            .DS_Store
            LICENSE.txt
            administrativo/
            administrativo/**
            **/*.log
            **/receive copy/**
            **/receive%20copy/**
            **/* copy.php

      - name: Deploy incremental (tentativa 3)
        id: deploy3
        if: steps.deploy2.outcome == 'failure'
        timeout-minutes: 20
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ env.FTP_HOST }}
          username: ${{ env.FTP_USER }}
          password: ${{ env.FTP_PASS }}
          protocol: ftps
          security: loose
          local-dir: ./
          server-dir: ${{ env.SERVER_DIR }}
          timeout: 300000
          log-level: standard
          dangerous-clean-slate: false
          exclude: |
            .git/
            .git/**
            .github/
            .github/**
            .vscode/
            .vscode/**
            node_modules/
            node_modules/**
            vendor/
            vendor/**
            lib/
            lib/**
            .env
            .gitignore
            .DS_Store
            LICENSE.txt
            administrativo/
            administrativo/**
            **/*.log
            **/receive copy/**
            **/receive%20copy/**
            **/* copy.php

      - name: Instalar lftp para fallback
        if: env.FORCE_LFTP_FALLBACK == 'true' || (steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure' && steps.deploy3.outcome == 'failure')
        run: |
          if ! command -v lftp >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          fi

      - name: Fallback lftp incremental
        id: lftp_fallback
        if: env.FORCE_LFTP_FALLBACK == 'true' || (steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure' && steps.deploy3.outcome == 'failure')
        timeout-minutes: 60
        continue-on-error: true
        run: |
          set +e
          lftp <<EOF
          set cmd:fail-exit no
          set dns:order "inet inet6"
          set ftp:passive-mode true
          set ssl:verify-certificate no
          set ftp:ssl-force true
          set net:timeout 300
          set net:max-retries 200
          set net:reconnect-interval-base 5
          set net:reconnect-interval-max 60
          set net:idle 120
          set xfer:clobber on
          open -u "$FTP_USER","$FTP_PASS" ftp://$FTP_HOST
          mirror -R --parallel=3 --only-newer --continue --no-perms \
            --exclude-glob .git/** \
            --exclude-glob .github/** \
            --exclude-glob .vscode/** \
            --exclude-glob node_modules/** \
            --exclude-glob vendor/** \
            --exclude-glob lib/** \
            --exclude-glob administrativo/** \
            --exclude-glob '*.log' \
            --exclude-glob .env \
            --exclude-glob .gitignore \
            --exclude-glob .DS_Store \
            --exclude-glob LICENSE.txt \
            --exclude-glob '*receive copy*' \
            --exclude-glob '*receive%20copy*' \
            --exclude-glob '* copy.php' \
            ./ $LFTP_TARGET
          quit
          EOF

      - name: Detectar modo de sincronizacao remoto
        if: always()
        continue-on-error: true
        run: |
          if ! command -v lftp >/dev/null 2>&1; then
            echo "Modo detectado: NAO FOI POSSIVEL DETERMINAR (lftp indisponivel)"
            exit 0
          fi

          STATE_CHECK="$(lftp <<EOF
          set cmd:fail-exit no
          set dns:order "inet inet6"
          set ftp:passive-mode true
          set ssl:verify-certificate no
          set ftp:ssl-force true
          open -u "$FTP_USER","$FTP_PASS" ftp://$FTP_HOST
          [ "$REMOTE_DIR_NORMALIZED" != "." ] && cd "$REMOTE_DIR_NORMALIZED"
          cls -1 .ftp-deploy-sync-state.json
          quit
          EOF
          )"

          if echo "$STATE_CHECK" | grep -q ".ftp-deploy-sync-state.json"; then
            echo "Modo detectado: INCREMENTAL"
          else
            echo "Modo detectado: FULL SYNC"
          fi

      - name: Diagnostico de erro em linguagem simples
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure' && steps.deploy3.outcome == 'failure' && steps.lftp_fallback.outcome == 'failure'
        continue-on-error: true
        run: |
          if ! command -v lftp >/dev/null 2>&1; then
            echo "::error::Falha total de deploy. lftp indisponivel para classificar erro automaticamente."
            exit 0
          fi

          CONNECT_OUT="$(lftp <<EOF
          set cmd:fail-exit no
          set dns:order "inet inet6"
          set ftp:passive-mode true
          set ssl:verify-certificate no
          set ftp:ssl-force true
          set net:timeout 20
          set net:max-retries 2
          open -u "$FTP_USER","$FTP_PASS" ftp://$FTP_HOST
          pwd
          quit
          EOF
          )"

          if echo "$CONNECT_OUT" | grep -Eiq "timed out|ETIMEDOUT|ENETUNREACH|No route|refused|Login failed|530"; then
            echo "::error::Erro principal: conexao FTP/FTPS instavel ou credenciais invalidas."
            echo "Acao sugerida: validar secrets e testar conectividade da KingHost no horario do deploy."
            exit 0
          fi

          WRITE_PROBE=".ci-write-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          WRITE_OUT="$(lftp <<EOF
          set cmd:fail-exit no
          set dns:order "inet inet6"
          set ftp:passive-mode true
          set ssl:verify-certificate no
          set ftp:ssl-force true
          open -u "$FTP_USER","$FTP_PASS" ftp://$FTP_HOST
          [ "$REMOTE_DIR_NORMALIZED" != "." ] && cd "$REMOTE_DIR_NORMALIZED"
          mkdir "$WRITE_PROBE"
          rmdir "$WRITE_PROBE"
          quit
          EOF
          )"

          if echo "$WRITE_OUT" | grep -Eiq "No such file|550 .*No such file"; then
            echo "::error::Erro principal: caminho remoto invalido (REMOTE_DIR)."
            echo "Acao sugerida: usar '.' quando app/public aparecem na raiz FTP."
            exit 0
          fi

          if echo "$WRITE_OUT" | grep -Eiq "Operation not permitted|Permission denied|550"; then
            echo "::error::Erro principal: sem permissao de escrita no diretorio remoto."
            echo "Acao sugerida: ajustar dono/permissoes no servidor ou usuario FTP no painel."
            exit 0
          fi

          echo "::warning::Falha nao classificada automaticamente. Revisar logs completos do job."

      - name: Resumo final
        if: always()
        run: |
          echo "Tentativa 1: ${{ steps.deploy1.outcome }}"
          echo "Tentativa 2: ${{ steps.deploy2.outcome }}"
          echo "Tentativa 3: ${{ steps.deploy3.outcome }}"
          echo "Fallback lftp: ${{ steps.lftp_fallback.outcome }}"

          if [ "${{ steps.deploy1.outcome }}" = "success" ] || [ "${{ steps.deploy2.outcome }}" = "success" ] || [ "${{ steps.deploy3.outcome }}" = "success" ]; then
            echo "Resultado: DEPLOY CONCLUIDO VIA FTP ACTION"
          elif [ "${{ steps.lftp_fallback.outcome }}" = "success" ]; then
            echo "Resultado: DEPLOY CONCLUIDO VIA LFTP FALLBACK"
          else
            echo "Resultado: DEPLOY FALHOU"
          fi

      - name: Falhar job se nenhum deploy concluiu
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure' && steps.deploy3.outcome == 'failure' && steps.lftp_fallback.outcome != 'success'
        run: |
          echo "Nenhuma estrategia de deploy concluiu com sucesso."
          exit 1
