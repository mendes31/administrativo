name: Deploy PHP para Kinghost (Estratégia Dividida)
 
on:
  push:
    branches:
      - main
      - dev-master
  workflow_dispatch: {}
 
jobs:
  deploy:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup PHP com Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3.14'
          coverage: none
          tools: composer:2.8.5

      - name: Validar PHP e Composer
        run: |
          php -v
          composer --version
          composer validate --no-check-publish

      # Dependências não serão enviadas; composer deve ser executado no servidor (SSH/cron)
 
      - name: Deploy Aplicação Completa (sem vendor)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./
          server-dir: ./www/administrativo/
          dangerous-clean-slate: false
          log-level: verbose
          timeout: 120000  # 20 minutos definidos mas apenas 60 segundos (limite do servidor)
          exclude: |
            .git/
            .git/**
            .github/
            .github/**
            .gitignore
            .env
            .DS_Store
            README.md
            LICENSE.txt
            node_modules/
            node_modules/**
            .vscode/
            .vscode/**
            logs/
            logs/**
            vendor/
            vendor/**
            bootstrap-5.3.3-dist/
            bootstrap-5.3.3-dist/**
            DataTables/
            DataTables/**
            startbootstrap-sb-admin-gh-pages/
            startbootstrap-sb-admin-gh-pages/**
            scripts/fix_urls.py
            scripts/fix_urls.sh

      # Sem deploy de vendor: instale no servidor após o upload
 
      # Etapas separadas removidas; deploy único cria toda a estrutura
