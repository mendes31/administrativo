name: Deploy PHP para Kinghost (rápido + seguro)

# 1) Deploy rápido: só ficheiros alterados no push (segundos).
# 2) Se falhar ou >150 ficheiros: FTP-Deploy-Action (hash incremental).
# 3) Fallback lftp upload-only (sem --delete) se FTP falhar.
#
# Uploads (.env, public/adms/uploads/**) nunca enviados. dangerous-clean-slate: false.

on:
  push:
    branches:
      - main
      - dev-master
  workflow_dispatch:

concurrency:
  group: deploy-kinghost-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      FTP_REMOTE_BASE: ''

    steps:
      - name: Checkout código
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Verificar Secrets FTP
        run: |
          if [ -z "${{ secrets.FTP_SERVER_PROD }}" ] || [ -z "${{ secrets.FTP_USER_PROD }}" ] || [ -z "${{ secrets.FTP_PASS_PROD }}" ]; then
            echo "❌ Secrets FTP incompletos"
            exit 1
          fi
          echo "✅ Secrets FTP configurados"

      - name: Deploy rápido — ficheiros deste push
        id: deploy_fast
        continue-on-error: true
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER_PROD }}
          FTP_USER: ${{ secrets.FTP_USER_PROD }}
          FTP_PASS: ${{ secrets.FTP_PASS_PROD }}
          GIT_BEFORE: ${{ github.event.before }}
          GIT_AFTER: ${{ github.sha }}
        run: php scripts/deploy_push_changed_files.php

      - name: Deploy incremental — tentativa 1
        id: deploy1
        if: steps.deploy_fast.outcome != 'success'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER_PROD }}
          username: ${{ secrets.FTP_USER_PROD }}
          password: ${{ secrets.FTP_PASS_PROD }}
          local-dir: ./
          server-dir: ./
          dangerous-clean-slate: false
          log-level: minimal
          timeout: 300000
          exclude: |
            .git/
            .git/**
            .github/
            .github/**
            .gitignore
            .DS_Store
            LICENSE.txt
            node_modules/
            node_modules/**
            .vscode/
            .vscode/**
            **/*.log
            vendor/
            vendor/**
            lib/
            lib/**
            storage/sst/epi_fichas/**
            storage/sst/attachments/**
            storage/lgpd/consentimentos/**
            storage/private/payroll/**
            !storage/private/payroll/.gitkeep
            storage/cache/**
            storage/logs/**
            logs/**
            app/storage/cache/**
            app/storage/logs/**
            public/adms/uploads/**
            .env

      - name: Aguardar retry (20s)
        if: steps.deploy_fast.outcome != 'success' && steps.deploy1.outcome != 'success'
        run: sleep 20

      - name: Deploy incremental — tentativa 2
        id: deploy2
        if: steps.deploy_fast.outcome != 'success' && steps.deploy1.outcome != 'success'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER_PROD }}
          username: ${{ secrets.FTP_USER_PROD }}
          password: ${{ secrets.FTP_PASS_PROD }}
          local-dir: ./
          server-dir: ./
          dangerous-clean-slate: false
          log-level: minimal
          timeout: 300000
          exclude: |
            .git/
            .git/**
            .github/
            .github/**
            .gitignore
            .DS_Store
            LICENSE.txt
            node_modules/
            node_modules/**
            .vscode/
            .vscode/**
            **/*.log
            vendor/
            vendor/**
            lib/
            lib/**
            storage/sst/epi_fichas/**
            storage/sst/attachments/**
            storage/lgpd/consentimentos/**
            storage/private/payroll/**
            !storage/private/payroll/.gitkeep
            storage/cache/**
            storage/logs/**
            logs/**
            app/storage/cache/**
            app/storage/logs/**
            public/adms/uploads/**
            .env

      - name: Instalar lftp (fallback)
        if: steps.deploy_fast.outcome != 'success' && steps.deploy1.outcome != 'success' && steps.deploy2.outcome != 'success'
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Fallback lftp — upload only
        id: deploy_lftp
        if: steps.deploy_fast.outcome != 'success' && steps.deploy1.outcome != 'success' && steps.deploy2.outcome != 'success'
        continue-on-error: true
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER_PROD }}
          FTP_USER: ${{ secrets.FTP_USER_PROD }}
          FTP_PASS: ${{ secrets.FTP_PASS_PROD }}
        run: |
          chmod +x scripts/deploy_lftp_upload.sh
          ./scripts/deploy_lftp_upload.sh fallback

      - name: Verificar ficheiros críticos (SHA-256)
        id: verify_hashes
        if: steps.deploy_fast.outcome == 'success' || steps.deploy1.outcome == 'success' || steps.deploy2.outcome == 'success' || steps.deploy_lftp.outcome == 'success'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER_PROD }}
          FTP_USER: ${{ secrets.FTP_USER_PROD }}
          FTP_PASS: ${{ secrets.FTP_PASS_PROD }}
        run: php scripts/verify_ftp_deploy_hashes.php

      - name: Resumo
        if: always()
        run: |
          echo "📊 Resumo:"
          echo "   Deploy rápido (push):    ${{ steps.deploy_fast.conclusion }}"
          echo "   Incremental tent. 1:     ${{ steps.deploy1.conclusion }}"
          echo "   Incremental tent. 2:     ${{ steps.deploy2.conclusion }}"
          echo "   Fallback lftp:           ${{ steps.deploy_lftp.conclusion }}"
          echo "   SHA-256:                 ${{ steps.verify_hashes.conclusion }}"

      - name: Resultado final
        if: always()
        run: |
          ok=0
          if [ "${{ steps.deploy_fast.outcome }}" = "success" ] || [ "${{ steps.deploy1.outcome }}" = "success" ] || [ "${{ steps.deploy2.outcome }}" = "success" ] || [ "${{ steps.deploy_lftp.outcome }}" = "success" ]; then
            ok=1
          fi
          if [ "$ok" -eq 0 ]; then
            echo "❌ FALHA no deploy."
            exit 1
          fi
          if [ "${{ steps.verify_hashes.conclusion }}" != "success" ]; then
            echo "❌ FALHA na verificação SHA-256."
            exit 1
          fi
          echo "🎯 SUCESSO — deploy concluído."
