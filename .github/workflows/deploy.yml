name: Deploy PHP para Kinghost (Otimizado)

on:
  push:
    branches:
      - main
      - dev-master
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Instalar lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy Incremental via lftp
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER_PROD }}
          FTP_USER: ${{ secrets.FTP_USER_PROD }}
          FTP_PASS: ${{ secrets.FTP_PASS_PROD }}
        run: |
          echo "🚀 Iniciando deploy incremental para KingHost..."
          
          # O comando lftp é mais resiliente a timeouts da KingHost
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<'EOF'
          # Configurações de Conexão
          set ftp:passive-mode true
          set ftp:ssl-allow no
          set net:timeout 60
          set net:max-retries 10
          set net:reconnect-interval-base 5
          
          # 1. Garantir que as pastas de logs e uploads existam na raiz
          # Como o login cai na raiz, não usamos caminhos absolutos como /home/...
          app/adms/Controllers/logs
          app/adms/Views/logs
          public/uploads
          logs

          # 2. Sincronização Principal (Mirror)
          # --only-newer: só envia o que mudou
          # --reverse: do local para o remoto
          # --parallel=2: envia 2 arquivos por vez (evita travar a conexão)
          mirror --reverse --parallel=2 --only-newer --continue --no-perms --verbose \
            --exclude-glob .git/ \
            --exclude-glob .github/ \
            --exclude-glob .gitignore \
            --exclude-glob .env \
            --exclude-glob *.log \
            --exclude-glob vendor/ \
            --exclude-glob node_modules/ \
            --exclude-glob .vscode/ \
            --exclude-glob .DS_Store \
            --exclude-glob LICENSE.txt \
            ./ .
          
          quit
          EOF

      - name: Feedback Final
        if: always()
        run: |
          echo "✅ Processo de deploy finalizado."
          echo "Se houver erro de 'Timeout', verifique se o IP do GitHub não foi bloqueado temporariamente pelo Firewall da KingHost."