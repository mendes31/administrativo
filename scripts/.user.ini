; Configurações PHP customizadas para produção
; Este arquivo será lido automaticamente pelo PHP

; LOGS DE ERRO - ESSENCIAL
log_errors = On
error_log = /home/administrativotiaraju/www/administrativo/logs/php_errors.log

; SEGURANÇA - Não mostrar erros na tela em produção
display_errors = Off
display_startup_errors = Off

; PERFORMANCE
max_execution_time = 240
memory_limit = 256M
post_max_size = 100M
upload_max_filesize = 100M

; TIMEZONE
date.timezone = America/Sao_Paulo

