; Configurações específicas para o projeto Administrativo
; Este arquivo é lido automaticamente pelo PHP para todos os scripts

; Aumentar limite de tempo de execução para operações pesadas
max_execution_time = 300

; Mais memória para leitura de planilhas grandes
memory_limit = 512M

; Tamanho máximo de upload/post adequado para arquivos de planilha
post_max_size = 100M
upload_max_filesize = 100M


